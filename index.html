<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Autoškola jednoduše</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column, one task per screen; bottom sheet turns into the explanation after answering. Road-sign world: sign blue, asphalt neutrals, Overpass (a Highway Gothic descendant). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202b; --muted:#5b6676; --line:#dde2ea;
  --sign:#1d5bc4; --sign-ink:#ffffff; --sign-soft:#e4ecfa;
  --ok:#11845b; --ok-soft:#e1f4ec; --warn:#b5660b; --warn-soft:#fbefdc;
  --gold:#e9b10a; --asphalt:#4a5361; --lane:#ffffff;
  --display:"Overpass","Segoe UI",system-ui,sans-serif;
  --body:"Overpass","Segoe UI",system-ui,sans-serif;
  --mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#19202a; --ink:#e9edf3; --muted:#9aa5b5; --line:#2a3340;
  --sign:#5b91ee; --sign-ink:#0b1220; --sign-soft:#1b2a44;
  --ok:#3fc58f; --ok-soft:#14302a; --warn:#f0a447; --warn-soft:#3a2a14;
  --gold:#f2c230; --asphalt:#3a414c; --lane:#d9dee6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#19202a; --ink:#e9edf3; --muted:#9aa5b5; --line:#2a3340;
  --sign:#5b91ee; --sign-ink:#0b1220; --sign-soft:#1b2a44;
  --ok:#3fc58f; --ok-soft:#14302a; --warn:#f0a447; --warn-soft:#3a2a14;
  --gold:#f2c230; --asphalt:#3a414c; --lane:#d9dee6; color-scheme:dark}
html,body{height:100%}
body{margin:0}[hidden]{display:none!important}img{max-width:100%}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.btn{border:0;border-radius:var(--r);padding:15px 18px;font-weight:800;font-size:17px;letter-spacing:.02em;background:var(--sign);color:var(--sign-ink);width:100%;box-shadow:0 3px 0 color-mix(in srgb,var(--sign) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--sign) 60%,#000)}
.btn.ghost{background:transparent;color:var(--sign);box-shadow:none;border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000);color:#fff}
.btn.small{padding:9px 14px;font-size:15px;width:auto}
.label{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}

/* Home */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-family:var(--mono);font-size:15px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.hello h1{font-size:30px;font-weight:900}
.hello p{margin:4px 0 0;color:var(--muted)}
.ready{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.meter i{height:16px;border-radius:4px;background:var(--line)}
.meter i.on{background:var(--sign)}
.ready .big{font-family:var(--mono);font-weight:700;font-size:34px}
.goal{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.goal b{display:block;height:100%;background:var(--gold);border-radius:99px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode b{font-family:var(--display);font-size:16px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.mode span{font-size:14px;color:var(--muted)}
.mode .sign{width:34px;height:34px;border-radius:8px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-weight:900;font-family:var(--display)}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center}
.coach{background:var(--sign-soft);border-radius:var(--r);padding:14px 16px}
.coach p{margin:0 0 10px}

/* Lesson */
.lesson{display:flex;flex-direction:column;gap:14px;flex:1}
.lbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:4px 6px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.media{border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.media img,.media video{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;background:#fff}
.qtext{font-family:var(--display);font-size:21px;font-weight:800;line-height:1.3;margin:0}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;font-size:17px;box-shadow:0 2px 0 var(--line)}
.ans .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;font-family:var(--mono)}
.ans.sel{border-color:var(--sign);background:var(--sign-soft)}
.ans.right{border-color:var(--ok);background:var(--ok-soft)}
.ans.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.wrong{border-color:var(--warn);background:var(--warn-soft)}
.ans.wrong .k{border-color:var(--warn);color:var(--warn)}
.ans:disabled{cursor:default}
.ans img{max-width:140px;max-height:110px;border-radius:6px;background:#fff;object-fit:contain}
.hint{background:var(--surface);border:1px dashed var(--gold);border-radius:var(--r);padding:12px 14px;font-size:16px}
.hint p{margin:0}
.hint p+p{margin-top:8px}
.hintbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
.sheet{position:relative;margin-inline:-16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:3px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.08);animation:up .25s ease-out}
.sheet.good{border-top-color:var(--ok)}
.sheet.bad{border-top-color:var(--warn)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.react{font-family:var(--display);font-size:22px;font-weight:900}
.good .react{color:var(--ok)} .bad .react{color:var(--warn)}
.sheet p{margin:0}
.memo{background:var(--bg);border-radius:10px;padding:10px 12px}
.memo .label{display:block;margin-bottom:2px}
.detail{display:flex;flex-direction:column;gap:10px;max-height:40vh;overflow:auto;padding-right:4px}
.detail h4{margin:0;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.detail p{font-size:16px}
.unver{font-size:12px;color:var(--muted)}
.sheet .row{flex-wrap:wrap}.sheet .row .btn.ghost{white-space:nowrap}
.iconbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:48px;height:48px;flex:none;font-size:20px}
.scene{background:var(--bg);border-radius:12px;padding:8px}
.scene svg{display:block;width:100%;max-width:320px;margin:0 auto;height:auto}
.scene .cap{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}

/* Exam */
.timer{font-family:var(--mono);font-weight:700;font-size:16px}
.result{text-align:center;padding-block:20px}
.result .score{font-family:var(--mono);font-size:56px;font-weight:700}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:900;letter-spacing:.05em}
.badge.pass{background:var(--ok-soft);color:var(--ok)}
.badge.fail{background:var(--warn-soft);color:var(--warn)}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.review .yours{color:var(--warn)} .review .corr{color:var(--ok)}

/* Mistakes */
.bars{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bar{display:grid;grid-template-columns:1fr 52px;gap:4px 10px;align-items:center}
.bar .t{height:10px;border-radius:99px;background:var(--line);overflow:hidden;grid-column:1/-1}
.bar .t b{display:block;height:100%;border-radius:99px}
.bar .n{text-align:right;font-family:var(--mono);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:20px}
.stat span{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}

/* Admin */
.adm-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.adm-item.off{opacity:.55}
.adm-item textarea,.adm-item input[type=text],select,.adm-io{width:100%;font:inherit;font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-sizing:border-box}
.adm-item textarea{min-height:56px;resize:vertical}
.adm-item label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
a{color:var(--sign)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script id="learning-data" type="application/json">{"RP0604222": {"topics": ["Povinnosti řidiče"], "short": "Auto musíš očistit ještě předtím, než vjedeš na silnici.", "wrong": "Bláto z pole nebo stavby nesmí skončit na silnici. Proto se auto čistí předem, ne až potom.", "why": "Bláto a hlína na vozovce kloužou a ohrožují ostatní. Zákon proto chce, abys silnici vůbec neznečistila. Když už se to stane, musíš to uklidit, ale primárně platí: očistit předem.", "hints": ["Je lepší řešit nepořádek dřív, nebo až potom?", "Hledej odpověď, která nedává žádnou výjimku."], "mnemonic": "Nejdřív čistá kola, pak silnice.", "pitfall": "Odpověď B zní rozumně, ale obsahuje výjimku „bez větších obtíží“. Zákon žádnou takovou úlevu nedává.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Vozidlo vjíždějící na pozemní komunikaci musí být předem očištěno tak, aby ji neznečišťovalo.", "verified": false}, "RP0606185": {"topics": ["Značky a signály", "Pojmy"], "short": "Místní úprava (značky, semafory) má přednost před obecnými pravidly.", "wrong": "Značky a semafory jsou „místní úprava“. Když něco nařizují, platí to víc než obecné pravidlo, třeba pravá ruka.", "why": "Obecná pravidla platí všude, kde nic jiného neříkají značky. Jakmile je na místě značka nebo semafor, řídíš se jimi. Ještě výš stojí jen pokyny policisty.", "hints": ["Co platí víc: obecné pravidlo, nebo značka přímo na místě?", "Představ si křižovatku se značkou Hlavní pozemní komunikace. Platí tam pravidlo pravé ruky?"], "mnemonic": "Policista > semafor > značky > obecná pravidla.", "pitfall": "„Podřazená“ a „nadřazená“ se snadno spletou. Místní úprava je ta silnější.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Místní úprava provozu je nadřazena obecné úpravě; pokyny policisty mají přednost před místní úpravou.", "verified": false}, "RP0604199": {"topics": ["Povinnosti řidiče", "Bezpečnost"], "short": "Po každé nehodě, kde jsi účastnice, musíš hned zastavit.", "wrong": "U nehody nehraje roli, jak velká je škoda. Kdo je účastník nehody, vždy hned zastaví.", "why": "Zastavení je první povinnost: zjistíš, jestli někdo nepotřebuje pomoc, a zabráníš další nehodě. Teprve potom se řeší, jestli se volá policie (to už na výši škody záleží).", "hints": ["Záleží povinnost zastavit na tom, jak velká je škoda?", "Co je první věc, kterou uděláš po ťuknutí do jiného auta?"], "mnemonic": "Nehoda = stop. Vždy.", "pitfall": "Částka 50 000 Kč je léčka. Nesouvisí se zastavením, a navíc dnes je hranice pro volání policie jiná.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Účastník dopravní nehody je povinen neprodleně zastavit vozidlo.", "verified": false}, "RP0605535": {"topics": ["Chodci a cyklisté"], "short": "V pěší zóně jsou chodci „doma“. Nesmíš je ohrozit a když je potřeba, zastavíš.", "wrong": "V pěší zóně mají chodci výsadní postavení. Musíš být extra ohleduplná a v případě nutnosti zastavit.", "why": "Do pěší zóny smíš autem jen výjimečně (zásobování, povolení). Chodci tam mohou chodit kdekoli, i středem ulice. Ty jedeš krokem, nesmíš je ohrozit a když je potřeba, zastavíš.", "hints": ["Komu pěší zóna patří?", "Dvě odpovědi jsou skoro stejné. Hledej tu, která říká, co uděláš „v případě nutnosti“."], "mnemonic": "Pěší zóna: chodec je šéf.", "pitfall": "Rozdíl mezi A a B je jemný. Správná je ta se zastavením „v případě nutnosti“.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. V pěší a obytné zóně musí řidič dbát zvýšené ohleduplnosti vůči chodcům, které nesmí ohrozit; v případě nutnosti musí zastavit.", "verified": false}, "RP0606125": {"topics": ["Povinnosti řidiče", "Bezpečnost"], "short": "Za jízdy nesmíš pít alkohol ani brát drogy.", "wrong": "Otázka se ptá jen na to, co platí během jízdy. Před jízdou je samozřejmě taky zakázáno řídit pod vlivem.", "why": "V Česku platí nulová tolerance: nesmíš řídit pod vlivem alkoholu a nesmíš ho pít ani během jízdy. Možnosti B a C jsou vymyšlené časové lhůty, které zákon neobsahuje.", "hints": ["Která z možností popisuje jednoduchý zákaz bez lhůt?", "Hledej tu, kde máš ruce na volantu."], "mnemonic": "Za volantem: nula. Vždycky.", "pitfall": "Nenech se zmást „24 hodinami“. Žádná taková lhůta v zákoně není, rozhoduje, jestli máš v krvi alkohol.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidič nesmí požít alkoholický nápoj nebo užít návykovou látku během jízdy a nesmí řídit pod jejich vlivem.", "verified": false}, "RP1008039": {"topics": ["Pojmy"], "short": "„Stát“ = auto v klidu déle, než je povoleno pro zastavení.", "wrong": "Zastavení je krátké (nastoupit, vystoupit, naložit). Jakmile auto stojí déle, je to „stání“.", "why": "Zákon rozlišuje dvě slova. Zastavit = uvést vozidlo do klidu na dobu nezbytně nutnou k nastoupení nebo vystoupení, naložení nebo složení nákladu. Stát = uvést vozidlo do klidu nad tuto dobu. Zastavení na semaforu ani v koloně není „zastavení“ ani „stání“ v tomto smyslu.", "hints": ["Která odpověď mluví o čase?", "Rozdíl mezi „zastavit“ a „stát“ je hlavně v tom, jak dlouho."], "mnemonic": "Zastavit = chvilka. Stát = déle.", "pitfall": "Odpověď C popisuje zastavení kvůli provozu. To není stání.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Stát znamená uvést vozidlo do klidu nad dobu dovolenou pro zastavení.", "verified": false}, "RP1008029": {"topics": ["Pojmy", "Vozidlo a doklady"], "short": "Doklad totožnosti je doklad podle zvláštního zákona (např. občanka, pas).", "wrong": "Ne každá kartička s fotkou je doklad totožnosti. Platí jen doklady, které tak určuje zvláštní zákon.", "why": "Totožnost prokazuješ dokladem, který k tomu určuje jiný zákon. Pro občana ČR je to typicky občanský průkaz nebo cestovní pas. Řidičák s fotkou sám o sobě doklad totožnosti podle definice není.", "hints": ["Je řidičák nebo průkazka do posilovny doklad totožnosti?", "Hledej odpověď, která odkazuje na jiný předpis."], "mnemonic": "", "pitfall": "Odpověď B zní jistě, ale „pouze občanský průkaz“ je moc úzké. Totožnost prokáže třeba i pas.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Dokladem totožnosti je doklad, kterým občan ČR nebo cizinec prokazuje svou totožnost podle zvláštního právního předpisu.", "verified": false}, "RP0606197": {"topics": ["Bezpečnost", "Povinnosti řidiče"], "short": "Při snížené viditelnosti svítíš obrysovými a potkávacími (nebo dálkovými) světly.", "wrong": "Ve tmě nebo v mlze musíš svítit obrysovými a potkávacími světly. Dálková smíš, jen pokud tím nikoho neoslníš.", "why": "Snížená viditelnost je tma, mlha, hustý déšť nebo sněžení. Potřebuješ vidět a hlavně být vidět. Proto obrysová + potkávací. Dálková jsou možná, ale ne „jen dálková“ a ne vždy.", "hints": ["Která odpověď je nejúplnější?", "Pozor na slovo „jen“."], "mnemonic": "Tma nebo mlha? Obrysovky + potkávačky.", "pitfall": "Slovo „jen“ v odpovědích A a B je skoro vždy podezřelé.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Za snížené viditelnosti musí mít vozidlo rozsvícena obrysová a potkávací světla nebo dálková světla.", "verified": false}, "RP0605268": {"topics": ["Bezpečnost", "Povinnosti řidiče"], "short": "Náklad, který přečnívá o víc než 1 metr, musí být zvlášť označený.", "wrong": "Hranice je 1 metr. Když náklad přečnívá dopředu nebo dozadu víc, musí být označený, aby ho ostatní viděli.", "why": "Přečnívající náklad (třeba prkna nebo trubky) je nebezpečný, protože ho řidič za tebou nemusí vidět. Od 1 metru výš ho proto musíš označit předepsaným způsobem (praporek, ve tmě světlo).", "hints": ["Jde o kulaté číslo.", "Je to víc než půl metru."], "mnemonic": "Metr přes = musí být vidět.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Náklad přečnívající vozidlo vpředu nebo vzadu o více než 1 m musí být označen.", "verified": false}, "RP0606231": {"topics": ["Povinnosti řidiče"], "short": "Ostrůvek se objíždí vpravo. Vlevo jen kvůli překážce nebo když je to bezpečnější.", "wrong": "Ostrůvky objíždíme zprava, stejně jako jezdíme vpravo. Výjimka existuje: překážka nebo rozměry vozidla.", "why": "Pravidlo vychází z jízdy vpravo. Zákon ale připouští výjimku, když by jízda vpravo byla nemožná nebo nebezpečnější, třeba u velkého nákladu nebo kvůli překážce.", "hints": ["V Česku jezdíme vpravo. Platí to i tady?", "Absolutní slova jako „výlučně“ nebo „za žádných okolností“ bývají v testech špatně."], "mnemonic": "Ostrůvek? Vpravo, pokud nemusíš jinak.", "pitfall": "„Výlučně vpravo“ je moc přísné. Zákon výjimku zná.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Podél nástupního nebo ochranného ostrůvku se jezdí vpravo; vlevo jen brání-li jízdě vpravo překážka nebo je-li to bezpečnější s ohledem na rozměry vozidla nebo nákladu.", "verified": false}, "RP0606176": {"topics": ["Značky a signály"], "short": "Dvě střídavě blikající červená světla = zastav.", "wrong": "Tahle světla najdeš hlavně u železničních přejezdů. Znamenají jasné: stůj před nimi.", "why": "Střídavě přerušovaná červená světla se používají u přejezdů, mostů nebo výjezdů hasičů. Vždy znamenají „Stůj!“ před signalizačním zařízením. Červená nikdy neznamená zrychlení.", "hints": ["Co obecně znamená červená barva v dopravě?", "Kde jsi taková blikající světla viděla? Nejčastěji u vlaku."], "mnemonic": "Bliká červeně = vlak nebo nebezpečí. Stojím.", "pitfall": "", "rule": "Vyhláška č. 294/2015 Sb. (dopravní značky a signály): signál se dvěma střídavě přerušovanými červenými světly znamená povinnost zastavit vozidlo před signalizačním zařízením.", "verified": false}, "RP0606199": {"topics": ["Pojmy"], "short": "Rychlost smí měřit policie i obecní (městská) policie.", "wrong": "Kromě státní policie smí rychlost měřit i obecní (městská) policie. Dělá to na místech určených policií.", "why": "Zákon dává oprávnění měřit rychlost Policii ČR i obecní policii. Proto tě může „změřit“ i městská policie.", "hints": ["Viděla jsi někdy měřit rychlost městskou policii?"], "mnemonic": "Měří obě: státní i městská.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. K měření rychlosti vozidel je oprávněna policie a obecní policie.", "verified": false}, "RP0606117": {"topics": ["Bezpečnost", "Povinnosti řidiče"], "short": "Nastupovat a vystupovat smíš jen tak, abys neohrozila sebe ani nikoho jiného.", "wrong": "Bezpečí platí pro všechny. Pro ty, kdo vystupují, i pro ostatní kolem, třeba pro cyklistu, který jede kolem otevírajících se dveří.", "why": "Typická nehoda: někdo otevře dveře a do nich narazí cyklista. Proto se před otevřením dveří vždycky podíváš dozadu a vystoupíš jen tehdy, když nikoho neohrozíš.", "hints": ["Na koho musíš myslet při otvírání dveří?", "Dvě odpovědi jsou podobné. Liší se tím, jestli se počítá i s ostatními."], "mnemonic": "Než otevřeš dveře, podívej se do zrcátka.", "pitfall": "Odpověď B zní skoro stejně, ale „bez ohledu na ostatní účastníky“ ji dělá špatnou.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Nastupovat do vozidla nebo vystupovat z něj se smí jen tehdy, není-li tím ohrožena bezpečnost nastupujících nebo vystupujících osob ani jiných účastníků provozu.", "verified": false}, "RP1008017": {"topics": ["Pojmy", "Značky a signály"], "short": "Silnice pro motorová vozidla je ta, která je tak označená značkou.", "wrong": "O tom, jestli je silnice „pro motorová vozidla“, rozhoduje značka, ne rychlost ani počet pruhů.", "why": "Silnice pro motorová vozidla (bílé auto na modrém poli) je podobná dálnici. Pravidla na ní platí od značky začátku do značky konce.", "hints": ["Čím se pozná, že jsi na „silnici pro motorová vozidla“?"], "mnemonic": "Značka dělá silnici.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Silnice pro motorová vozidla je pozemní komunikace označená dopravní značkou „Silnice pro motorová vozidla“.", "verified": false}, "RP0606315": {"topics": ["Povinnosti řidiče"], "short": "V jednosměrce smíš couvat jen když je to nezbytné, třeba při vyjíždění z řady aut.", "wrong": "V jednosměrce couváš proti směru provozu, a to je nebezpečné. Smíš jen tehdy, když je to opravdu nutné.", "why": "Ostatní řidiči v jednosměrce nečekají, že by jim někdo jel naproti. Couvat je proto dovoleno jen výjimečně, typicky když vyjíždíš z parkování v řadě.", "hints": ["Je couvání v jednosměrce běžná věc, nebo výjimka?"], "mnemonic": "Jednosměrka: couvám jen když musím.", "pitfall": "Zvukové znamení couvání nedovoluje. To je léčka.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Na pozemní komunikaci s jednosměrným provozem smí řidič couvat jen tehdy, je-li to nezbytně nutné.", "verified": false}, "RP1108010": {"topics": ["Pojmy", "Přednost"], "short": "„Nesmět ohrozit“ = nikomu nesmí vzniknout žádné nebezpečí.", "wrong": "Pozor na rozdíl: „ohrozit“ je způsobit nebezpečí. „Omezit“ je jen překážet. To jsou dva různé pojmy.", "why": "Zákon rozlišuje: nesmět ohrozit (nesmí vzniknout nebezpečí) a nesmět omezit (nesmíš nikomu překážet). U chodců na přechodu platí obojí, jinde často „jen“ neohrozit.", "hints": ["Je „ohrozit“ totéž co „překážet“?", "Ohrožení souvisí s nebezpečím."], "mnemonic": "Ohrozit = nebezpečí. Omezit = překážet.", "pitfall": "Odpověď B popisuje „nesmět omezit“. Je to jiný pojem.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Nesmět ohrozit znamená povinnost počínat si tak, aby jinému účastníku provozu nevzniklo žádné nebezpečí.", "verified": false}, "RP0606466": {"topics": ["Pojmy"], "short": "Připojovací pruh slouží k tomu, aby ses zařadila do hlavního (průběžného) pruhu.", "wrong": "Připojovací pruh najdeš na nájezdu na dálnici. Rozjedeš se v něm a zařadíš se do průběžného pruhu.", "why": "Na nájezdu nejdřív zrychlíš na rychlost provozu, podíváš se do zrcátka a dáš blinkr. Pak se zařadíš. Pruh pro pomalá vozidla (odpověď B) je něco jiného.", "hints": ["Jak vypadá nájezd na dálnici?"], "mnemonic": "Připojovací = připojím se.", "pitfall": "Pruh pro pomalá vozidla je jiný pojem a odpověď B ho popisuje.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Připojovací pruh je jízdní pruh určený pro zařazování vozidel do průběžného pruhu.", "verified": false}, "RP0606147": {"topics": ["Bezpečnost"], "short": "V tunelu je kouření i otevřený oheň úplně zakázaný.", "wrong": "Tunel je uzavřený prostor a požár v něm je smrtelně nebezpečný. Proto nikdy oheň a nikdy kouření.", "why": "Kouř se v tunelu nemá kam ztratit a oheň se může rozšířit na další auta. Proto zákon zakazuje obojí bez výjimek.", "hints": ["Je v tunelu nějaká výjimka pro oheň?"], "mnemonic": "Tunel = žádný oheň, žádná cigareta.", "pitfall": "Možnosti B a C nabízejí výjimky. V tunelu žádné nejsou.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Při poruše vozidla v tunelu nesmí řidič kouřit ani zacházet s otevřeným ohněm.", "verified": false}, "RP0605359": {"topics": ["Pojmy", "Křižovatky"], "short": "Místo, kde se silnice protínají nebo spojují, je křižovatka.", "wrong": "Křižovatka je i místo, kde se silnice jen spojují (třeba tvar T). Výjimka: vyjetí z polní nebo lesní (účelové) cesty křižovatka není.", "why": "Pro pravidla přednosti je důležité vědět, co je křižovatka. Vyústění účelové komunikace (polní cesta, výjezd z parkoviště) křižovatka není, a proto tam neplatí pravá ruka. Kdo z ní vyjíždí, dává přednost všem.", "hints": ["Jak se jmenuje místo, kde se setkávají silnice?"], "mnemonic": "Protínají nebo spojují = křižovatka.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Křižovatka je místo, v němž se pozemní komunikace protínají nebo spojují; nepovažuje se za ni vyústění účelové pozemní komunikace.", "verified": false}, "RP0606195": {"topics": ["Povinnosti řidiče", "Bezpečnost"], "short": "Telefon v ruce za jízdy je zakázaný.", "wrong": "Držet telefon v ruce (nebo třeba mezi ramenem a uchem) za jízdy nesmíš. Hands-free je dovolené.", "why": "Telefon odvádí oči i pozornost. Zákon proto zakazuje držet telefon nebo jiné hovorové či záznamové zařízení v ruce nebo jiným způsobem.", "hints": ["Co ti za jízdy nejvíc odvede pozornost?"], "mnemonic": "Telefon v ruce = ruka pryč z volantu i hlava pryč ze silnice.", "pitfall": "Prudké zrychlení je nevhodné, ale zákon ho takto výslovně nezakazuje.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidič nesmí při jízdě držet v ruce nebo jiným způsobem telefonní přístroj nebo jiné hovorové nebo záznamové zařízení.", "verified": false}, "RP0605332": {"topics": ["Chodci a cyklisté", "Bezpečnost"], "short": "Před přechodem pro chodce se nepředjíždí. Blinkr na tom nic nemění.", "wrong": "Bezprostředně před přechodem je předjíždění zakázané. Auto, které předjíždíš, ti může zakrývat chodce.", "why": "Představ si: auto vedle tebe zastavuje, protože pouští chodce. Ty ho předjedeš a chodce, kterého jsi neviděla, srazíš. Proto je předjíždění před přechodem zakázané úplně.", "hints": ["Co může zakrývat auto, které předjíždíš?"], "mnemonic": "Přechod = žádné předjíždění.", "pitfall": "Znamení o změně směru (blinkr) z ničeho nedělá výjimku.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidič nesmí předjíždět bezprostředně před přechodem pro chodce a na něm.", "verified": false}, "RP0604313": {"topics": ["Přednost", "Křižovatky"], "short": "Z účelové komunikace (polní cesta, parkoviště) dáváš přednost všem na silnici.", "wrong": "Výjezd z polní cesty, z parkoviště nebo od benzínky není křižovatka. Pravá ruka tam neplatí. Pouštíš všechny.", "why": "Kdo vyjíždí z účelové komunikace, je v nejslabší pozici. Musí dát přednost vozidlům, jezdcům na zvířatech, organizovanému útvaru chodců i průvodcům zvířat. Prostě všem, kdo jdou nebo jedou po silnici.", "hints": ["Vyjíždíš z parkoviště na silnici. Kdo má přednost?", "Je výjezd z polní cesty křižovatka?"], "mnemonic": "Vyjíždím zbokem (z parkoviště nebo z pole) → pouštím všechny.", "pitfall": "Pozor, pravidlo pravé ruky tady neplatí, i když přijíždíš zprava.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Při vjíždění na pozemní komunikaci z účelové komunikace musí řidič dát přednost v jízdě vozidlům, jezdcům na zvířatech, organizovanému útvaru chodců a průvodcům hnaných zvířat.", "verified": false, "scene": {"main": ["E", "W"], "cars": [{"id": "me", "from": "S", "to": "E", "me": true}, {"id": "a", "from": "W", "to": "E", "label": "A"}], "order": ["a", "me"], "caption": "Vyjíždíš z polní cesty (zdola). Auto A jede po silnici, proto jede první, i když je vlevo od tebe."}}, "RP0606253": {"topics": ["Povinnosti řidiče"], "short": "Osob starších 12 let nesmí být víc, než je míst k sezení.", "wrong": "Každý nad 12 let musí mít své vlastní místo. Kolik je míst, tolik může jet lidí.", "why": "Když je lidí víc než míst, nemůže se každý připoutat a při nehodě je velké riziko zranění. Pro děti do 12 let platí zvláštní pravidla (autosedačky).", "hints": ["Kolik lidí se vejde do auta s pěti místy?"], "mnemonic": "Kolik sedadel, tolik lidí.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidič nesmí připustit, aby počet přepravovaných osob starších 12 let překročil počet povolených míst k přepravě osob.", "verified": false}, "RP1008042": {"topics": ["Pojmy", "Značky a signály"], "short": "Dálnice je silnice označená značkou „Dálnice“.", "wrong": "Dálnici nedělá počet pruhů ani rychlost, ale značka „Dálnice“.", "why": "Stejně jako u silnice pro motorová vozidla: pravidla dálnice platí od značky „Dálnice“ do značky „Konec dálnice“. Na dálnici je nejvyšší povolená rychlost 130 km/h.", "hints": ["Podle čeho poznáš, že jsi na dálnici?"], "mnemonic": "Značka dělá silnici.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Dálnice je pozemní komunikace označená dopravní značkou „Dálnice“.", "verified": false}, "RP0604258": {"topics": ["Povinnosti řidiče"], "short": "Při objíždění překážky dáváš znamení o změně směru (blinkr).", "wrong": "Objíždění je změna směru jízdy. Ostatní musí vědět, co uděláš, takže blinkr ano.", "why": "Kdykoli vybočíš ze své dráhy (objíždění, předjíždění, odbočení, rozjezd od kraje), dáváš znamení. Lidé za tebou i proti tobě se podle toho rozhodují.", "hints": ["Měníš při objíždění směr jízdy?"], "mnemonic": "Vybočuju = blikám.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Při objíždění překážky je řidič povinen dávat znamení o změně směru jízdy.", "verified": false}, "RP0606129": {"topics": ["Povinnosti řidiče"], "short": "Na tramvajový pás smíš vjet jen při objíždění, předjíždění, odbočování, otáčení, vjíždění na silnici nebo ze zvláštních důvodů.", "wrong": "Tramvajový pás není běžný jízdní pruh. Vjet na něj podélně smíš jen v konkrétních situacích.", "why": "Tramvaj nemůže uhnout a má dlouhou brzdnou dráhu. Proto po kolejích nejezdíš „jen tak“, ale jen když potřebuješ něco objet, předjet, odbočit nebo se otočit.", "hints": ["Která odpověď vyjmenovává nejvíc běžných situací?"], "mnemonic": "Koleje jsou pro tramvaj. Já jen projíždím.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Na tramvajový pás v úrovni vozovky se smí v podélném směru vjet jen při objíždění, předjíždění, odbočování, otáčení, vjíždění na pozemní komunikaci nebo vyžadují-li to zvláštní okolnosti.", "verified": false}, "RP0606282": {"topics": ["Značky a signály"], "short": "Vodorovné značky jsou barvou na silnici. Dočasné změny jsou žluté nebo oranžové.", "wrong": "Vodorovné značky = čáry a šipky na asfaltu. Normálně jsou bílé, dočasné (třeba u stavby) jsou žluté nebo oranžové.", "why": "Když u stavby vidíš na silnici žluté čáry vedle bílých, platí ty žluté. Jsou to přechodné značky a mají přednost.", "hints": ["Kde najdeš „vodorovné“ značky? Na sloupu, nebo na zemi?"], "mnemonic": "Žlutá na silnici = dočasně platí tahle.", "pitfall": "", "rule": "Vyhláška č. 294/2015 Sb.: vodorovné značky se vyznačují barvou nebo jiným srozumitelným způsobem; přechodná úprava žlutou nebo oranžovou barvou.", "verified": false}, "RP1401165": {"topics": ["Bezpečnost", "Značky a signály"], "short": "Stojí-li vozidlo s modrým majákem, zpomalíš a když je potřeba, zastavíš.", "wrong": "Maják na stojícím vozidle varuje, že je tam nebezpečí, třeba nehoda. Zpomal a podle situace i zastav.", "why": "Stojící záchranáři, hasiči nebo policie pracují u silnice. Lidé tam mohou chodit po vozovce. Proto snížit rychlost a být připravená zastavit. Nemusíš ale vždy zastavit.", "hints": ["Musíš u každého majáku zastavit, nebo „podle okolností“?"], "mnemonic": "Modrý maják stojí → noha z plynu.", "pitfall": "„Vždy zastavit“ je moc přísné.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Svítí-li zvláštní výstražné světlo modré barvy na stojícím vozidle, musí ostatní řidiči podle okolností snížit rychlost jízdy, popřípadě i zastavit vozidlo.", "verified": false}, "RP1008001": {"topics": ["Přednost", "Pojmy", "Křižovatky"], "short": "Dát přednost = nezačnu jet (nebo nepokračuju), kdyby ten druhý musel náhle brzdit nebo uhýbat.", "wrong": "Dát přednost neznamená vždycky zastavit. Znamená to nepřinutit druhého, aby musel náhle změnit směr nebo rychlost.", "why": "Když je silnice volná a nikoho neomezíš, můžeš jet i bez zastavení (pokud tam není STOP). Když někdo jede a musel by kvůli tobě brzdit nebo uhýbat, počkáš.", "hints": ["Musíš při „dej přednost“ vždycky zastavit?", "Hledej odpověď, kde je slovo „náhle“."], "mnemonic": "Dát přednost = ten druhý si mě nesmí všimnout brzdou.", "pitfall": "Odpověď A plete „Dej přednost“ se značkou STOP. Jen STOP znamená vždy zastavit.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Dát přednost v jízdě znamená povinnost řidiče nezahájit jízdu nebo jízdní úkon nebo v nich nepokračovat, jestliže by řidič, který má přednost, musel náhle změnit směr nebo rychlost jízdy.", "verified": false, "scene": {"main": [], "cars": [{"id": "me", "from": "S", "to": "N", "me": true}, {"id": "a", "from": "E", "to": "W", "label": "A"}], "order": ["a", "me"], "caption": "Příklad: rovnocenná křižovatka. Auto A přijíždí zprava, proto jede první. Kdybys jela, musel by prudce brzdit."}}, "RP0606072": {"topics": ["Bezpečnost"], "short": "Neotáčíš se na nepřehledných místech: v zatáčce, před vrcholem kopce, na něm ani za ním.", "wrong": "Otáčení trvá dlouho a auto přitom stojí napříč silnicí. Na nepřehledném místě by do tebe někdo narazil dřív, než tě uvidí.", "why": "Otočit se můžeš jen tam, kde tě ostatní vidí včas. Na přechodu, přejezdu pro cyklisty, u železničního přejezdu nebo v nepřehledné zatáčce ne.", "hints": ["Uvidí tě včas řidič, který vyjede zpoza zatáčky?"], "mnemonic": "Otáčím se jen tam, kde mě vidí.", "pitfall": "Odpovědi B a C nabízejí výjimky, které zákon nezná.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidič se nesmí otáčet na nepřehledném nebo jinak nebezpečném místě, zejména v nepřehledné zatáčce a v její blízkosti, před nepřehledným vrcholem stoupání, na něm a za ním.", "verified": false}, "RP0606119": {"topics": ["Povinnosti řidiče"], "short": "Před přejezdem stojí auta za sebou, v pořadí, jak přijela.", "wrong": "Před železničním přejezdem se nepředjíždí a nevytváří se druhá řada. Stojíte za sebou, jak jste přijeli.", "why": "Kdyby se auta před přejezdem řadila vedle sebe, po otevření závor by se tlačila na koleje. Proto jedno za druhým.", "hints": ["Smí se těsně před přejezdem předjíždět?"], "mnemonic": "Přejezd = fronta jako v obchodě.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Před železničním přejezdem se vozidla řadí za sebou v pořadí, ve kterém přijela.", "verified": false}, "RP0605521": {"topics": ["Povinnosti řidiče", "Chodci a cyklisté"], "short": "V obytné zóně smíš zastavit i stát jen na místech označených jako parkoviště.", "wrong": "Obytná zóna je hlavně pro lidi a děti. Auto tam smí zastavit i stát jen na vyznačeném parkovišti.", "why": "V obytné zóně si děti mohou hrát na ulici a chodci chodí po celé šířce. Auta zaparkovaná kdekoli by zakrývala výhled. Proto zastavit a stát jen na parkovišti. Rychlost max. 20 km/h.", "hints": ["Pro koho je obytná zóna hlavně určená?"], "mnemonic": "Obytná zóna: parkuju jen na P.", "pitfall": "Odpověď A dovoluje zastavit kdekoli. To neplatí.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. V obytné zóně smí řidič zastavit a stát jen na místech označených jako parkoviště.", "verified": false}, "RP0606106": {"topics": ["Povinnosti řidiče"], "short": "Protijedoucí se vyhýbají vpravo, včas a dostatečně.", "wrong": "Vyhýbá se vpravo, protože jezdíme vpravo. Zákon žádný konkrétní odstup jako 1 metr nestanoví, říká „včas a v dostatečné míře“.", "why": "Na úzké silnici každý uhne ke svému pravému okraji. Hlavně včas, ne až na poslední chvíli.", "hints": ["Na kterou stranu se v Česku vyhýbá?", "Je v zákoně konkrétní číslo v metrech?"], "mnemonic": "Vyhýbám se vpravo, včas.", "pitfall": "„1 m“ zní přesně, a proto lákavě. V zákoně ale není.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidiči protijedoucích vozidel se vyhýbají vpravo, včas a v dostatečné míře.", "verified": false}, "RP1108015": {"topics": ["Chodci a cyklisté"], "short": "Ne. Tramvaj má před chodci na přechodu výjimku.", "wrong": "Tramvaj nemůže uhnout a brzdí dlouho. Proto zákon povinnost pustit chodce na přechodu na tramvaj nevztahuje. Chodec ji musí pustit.", "why": "Pro auta platí: chodce, který zjevně chce přejít, nesmíš ohrozit ani omezit. Pro tramvaj tahle povinnost neplatí. Chodec před ni nesmí vstoupit.", "hints": ["Může tramvaj uhnout nebo rychle zastavit?"], "mnemonic": "Tramvaj je výjimka, má přednost i na přechodu.", "pitfall": "Většina lidí intuitivně řekne „ano“. U tramvaje je to ale „ne“.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Povinnost umožnit chodci nerušené a bezpečné přejití po přechodu se nevztahuje na řidiče tramvaje.", "verified": false}, "RP0604205": {"topics": ["Křižovatky", "Značky a signály", "Přednost"], "short": "Bliká-li žlutá, křižovatka není řízená semaforem. Platí značky, nebo pravá ruka.", "wrong": "Blikající žlutá znamená „semafor teď neřídí“. Řídíš se značkami, a když nejsou, pravidlem pravé ruky.", "why": "Blikající oranžová (žlutá) je jen upozornění „Pozor“. Přednost určují svislé značky (třeba Hlavní silnice nebo Dej přednost). Když tam žádné nejsou, dáváš přednost zprava.", "hints": ["Říká ti blikající žlutá, kdo má přednost?", "Co platí na křižovatce, kde semafor nic neřídí?"], "mnemonic": "Bliká žlutá → semafor spí → koukám na značky.", "pitfall": "Blikající žlutá NENÍ volný průjezd. To je nejčastější chyba.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Přerušované žluté světlo „Pozor!“ neznamená, že jde o křižovatku s provozem řízeným světelnými signály.", "verified": false, "scene": {"main": [], "cars": [{"id": "me", "from": "S", "to": "N", "me": true}, {"id": "a", "from": "E", "to": "W", "label": "A"}], "order": ["a", "me"], "caption": "Semafor bliká žlutě a nejsou tu žádné značky. Platí pravá ruka: auto A zprava jede první."}}, "RP0605263": {"topics": ["Pojmy"], "short": "Celník ve stejnokroji smí zastavovat vozidla.", "wrong": "Kromě policisty smí vozidla zastavovat i další osoby, třeba celník ve stejnokroji.", "why": "Zákon vyjmenovává, kdo smí zastavovat vozidla: policista, strážník obecní policie, celník, vojenský policista a další. Celník to smí i mimo hranice.", "hints": ["Je celník jen na hranicích?"], "mnemonic": "Uniforma celníka = smí tě zastavit.", "pitfall": "Hraniční přechody v schengenu skoro nejsou, takže odpověď C nedává smysl.", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Zastavovat vozidla je oprávněn mimo jiné celník ve stejnokroji.", "verified": false}, "RP1008003": {"topics": ["Pojmy"], "short": "Řidič je každý, kdo řídí motorové nebo nemotorové vozidlo nebo tramvaj.", "wrong": "Řidič je i cyklista (kolo je nemotorové vozidlo) a taky řidič tramvaje.", "why": "Proto pravidla pro „řidiče“ platí i pro cyklisty. Kolo je vozidlo, tak se na něj vztahují pravidla.", "hints": ["Je cyklista řidič?"], "mnemonic": "Řídíš něco s koly = jsi řidič.", "pitfall": "", "rule": "Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích. Řidič je ten, kdo řídí motorové nebo nemotorové vozidlo anebo tramvaj.", "verified": false}, "RP0605448": {"topics": ["Bezpečnost"], "short": "Přilnavost záleží na huštění, dezénu i na povrchu vozovky.", "wrong": "Přilnavost ovlivňují všechny tři věci najednou: pneumatika (huštění, dezén) i silnice (suchá, mokrá, led).", "why": "Stejná pneumatika drží jinak na suchém asfaltu a jinak na ledu. A stejná silnice se sjetou pneumatikou klouže víc než s novou. Proto je správně ta odpověď, která bere v úvahu všechno.", "hints": ["Klouže auto stejně na suchu i na ledu?"], "mnemonic": "Pneumatika + silnice = přilnavost.", "pitfall": "Odpovědi, které říkají, že něco „nemá vliv“, bývají špatně.", "rule": "", "verified": false}, "RP0605408": {"topics": ["Bezpečnost", "Vozidlo a doklady"], "short": "Klíny se dávají ke kolu úhlopříčně naproti, tedy k levému zadnímu, jeden před a jeden za.", "wrong": "Zvedáš pravé přední kolo, takže zajistíš kolo úhlopříčně naproti (levé zadní), a to z obou stran.", "why": "Kolo úhlopříčně naproti zůstává nejpevněji na zemi. Dva klíny (před a za) zabrání pohybu dopředu i dozadu.", "hints": ["Které kolo je od pravého předního nejdál?", "Kolik směrů pohybu chceš zastavit?"], "mnemonic": "Měním vpravo vpředu → klíny vlevo vzadu, z obou stran.", "pitfall": "", "rule": "", "verified": false}, "RP0606332": {"topics": ["Bezpečnost"], "short": "Při převozu sypkého materiálu dáváš pozor, aby z nákladu nic neodletovalo na ostatní.", "wrong": "Písek nebo štěrk může z korby odlétat a rozbít jinému autu sklo. Proto zvýšená opatrnost.", "why": "Konkrétní rychlost 40 km/h ani kontrola každou půlhodinu v zákoně nejsou. Podstatné je, abys nikoho neohrozila.", "hints": ["Je v zákoně konkrétní rychlost pro sypký náklad?"], "mnemonic": "Sypký náklad = nesmí létat.", "pitfall": "Přesná čísla v odpovědích jsou často léčka.", "rule": "", "verified": false}, "RP0605402": {"topics": ["Bezpečnost"], "short": "Ano. I malé množství alkoholu zhoršuje řízení.", "wrong": "Už jedno pivo prodlužuje reakční dobu a zhoršuje odhad. Káva na tom nic nezmění.", "why": "Alkohol působí na mozek hned: hůř odhadneš vzdálenost a rychlost a pomaleji reaguješ. Proto v Česku platí nulová tolerance.", "hints": ["Pomůže proti alkoholu káva?"], "mnemonic": "Jedno pivo = už ne za volant.", "pitfall": "Mýtus o černé kávě je opravdu jen mýtus.", "rule": "", "verified": false}, "RP0605416": {"topics": ["Bezpečnost"], "short": "Silný boční vítr čekej hlavně v otevřené krajině.", "wrong": "V lese a mezi protihlukovými stěnami jsi chráněná. Vítr tě zasáhne naplno v otevřené krajině, hlavně na mostech a při výjezdu z lesa.", "why": "Pozor na přechody: když vyjedeš z lesa nebo zpoza stěny do otevřené krajiny, poryv tě může náhle posunout. Drž volant pevně.", "hints": ["Kde fouká víc: v lese, nebo na otevřeném poli?"], "mnemonic": "Otevřeno = fouká.", "pitfall": "", "rule": "", "verified": false}, "RP0605459": {"topics": ["Bezpečnost", "Vozidlo a doklady"], "short": "Ke smyku v zatáčce může vést velký rozdíl v nahuštění pneumatik.", "wrong": "Když má každé kolo jiný tlak, každé drží silnici jinak a auto se může v zatáčce stočit.", "why": "Pneumatiky kontroluj pravidelně (aspoň jednou měsíčně) a hlavně stejně na obou stranách nápravy.", "hints": ["Co se stane, když jedno kolo drží silnici líp než druhé?"], "mnemonic": "Stejný tlak = stejný úchop.", "pitfall": "", "rule": "", "verified": false}, "RP0605392": {"topics": ["Bezpečnost", "Pojmy"], "short": "Aktivní bezpečnost brání vzniku nehody (např. ABS, dobré brzdy).", "wrong": "Aktivní = nehodě předchází (brzdy, ABS, světla). Pasivní = zmírňuje následky (pásy, airbagy).", "why": "Aktivní bezpečnost ti pomáhá nehodu vůbec nemít. Pasivní bezpečnost tě chrání, když už k nehodě dojde.", "hints": ["Pomáhá „aktivní“ bezpečnost před nehodou, nebo během ní?"], "mnemonic": "Aktivní = Abych nehodu neměla. Pasivní = Po nárazu.", "pitfall": "Odpovědi A a C popisují pasivní bezpečnost.", "rule": "", "verified": false}, "RP2403001": {"topics": ["Bezpečnost"], "short": "Defenzivní jízda = jezdit ohleduplně, ukázněně a předvídat chyby ostatních.", "wrong": "Defenzivní jízda není o rychlosti ani soutěžení. Jde o to počítat s tím, že ostatní udělají chybu.", "why": "Defenzivní řidička si říká: „Co když ten chodec vstoupí do silnice? Co když tamten nedá přednost?“ A je na to připravená.", "hints": ["Je cílem být co nejrychlejší?"], "mnemonic": "Defenzivně = počítám s chybami druhých.", "pitfall": "", "rule": "", "verified": false}, "RP1401151": {"topics": ["Bezpečnost"], "short": "Bez ABS se kola na ledu zablokují a auto přestane zatáčet.", "wrong": "Zablokovaná kola kloužou a volantem neuřídíš. Proto auto bez ABS brzdíš na ledu citlivě, přerušovaně.", "why": "Kolo, které se točí, se dá řídit. Kolo, které klouže, ne. ABS kola automaticky povoluje, aby se pořád točila.", "hints": ["Dá se řídit autem, které klouže se zablokovanými koly?"], "mnemonic": "Zablokovaná kola = auto jede rovně, ať točíš jak chceš.", "pitfall": "Zablokovaná kola nezastaví nejrychleji, na ledu je to naopak.", "rule": "", "verified": false}, "RP0606413": {"topics": ["Bezpečnost"], "short": "U pastviny počítáš s tím, že zvíře může vběhnout do silnice.", "wrong": "Zvířata nejsou předvídatelná. Zpomal a buď připravená brzdit. Troubení je může vyplašit přímo do silnice.", "why": "Zvuková výstraha se smí použít jen k odvrácení nebezpečí a zvíře může vyděsit. Nejlepší je předvídat a zpomalit.", "hints": ["Pomůže zatroubit, nebo může zvíře vyděsit?"], "mnemonic": "Zvíře u silnice = noha nad brzdou.", "pitfall": "", "rule": "", "verified": false}, "RP0812014": {"topics": ["Bezpečnost"], "short": "Ano. U cizího auta nevíš, jak brzdí a jak reaguje.", "wrong": "Každé auto má jiné brzdy, jinou spojku a jiné rozměry. První jízdy v cizím autě jsou proto vždy opatrnější.", "why": "Než vyjedeš, seřiď si sedadlo a zrcátka a zjisti, kde jsou světla a stěrače. Na prvních metrech si vyzkoušej brzdy.", "hints": ["Brzdí všechna auta stejně?"], "mnemonic": "Cizí auto = první kilometry v klidu.", "pitfall": "", "rule": "", "verified": false}, "RP0606329": {"topics": ["Bezpečnost"], "short": "Na krajnici dávej pozor, nezpevněná část se může propadnout a auto se převrátit.", "wrong": "Krajnice nemusí unést váhu auta, hlavně po dešti. Kolo může sjet a auto se může převrátit.", "why": "Na krajnici sjíždíš jen výjimečně a pomalu. Pozor hlavně na měkký okraj vedle asfaltu.", "hints": ["Je krajnice vždy zpevněná jako silnice?"], "mnemonic": "Krajnice = měkký okraj.", "pitfall": "", "rule": "", "verified": false}, "RP0604175": {"topics": ["Chodci a cyklisté", "Bezpečnost"], "short": "Když vidíš hrát si děti, zpomal a buď připravená brzdit.", "wrong": "Děti jsou nevyzpytatelné a mohou vběhnout do silnice za míčem. Proto zpomal a připrav se na brzdění.", "why": "Děti neumí dobře odhadnout rychlost auta a hra je pro ně důležitější než silnice. Řidič musí myslet za ně.", "hints": ["Odhadnou děti správně rychlost auta?"], "mnemonic": "Dítě u silnice = míč, a za ním dítě.", "pitfall": "Troubení není řešení, může děti vyděsit nebo přilákat.", "rule": "", "verified": false}, "RP0605405": {"topics": ["Bezpečnost"], "short": "Tempomat se hodí, když můžeš jet stálou rychlostí.", "wrong": "Tempomat drží stejnou rychlost. Hodí se na plynulý provoz, třeba na dálnici. Ne do města ani do kolony.", "why": "Tempomat šetří palivo a pozornost na dlouhé rovné cestě. V hustém provozu nebo na kluzké silnici ho vypni.", "hints": ["Hodí se tempomat do města se semafory?"], "mnemonic": "Tempomat = stejná rychlost, plynulá cesta.", "pitfall": "", "rule": "", "verified": false}, "RP0606398": {"topics": ["Vozidlo a doklady"], "short": "Nový přívěs dostane po registraci svou vlastní značku.", "wrong": "Každý registrovaný přívěs má svou vlastní registrační značku. Nesdílí ji s autem.", "why": "Přívěs je samostatné vozidlo s vlastním technickým průkazem a vlastní značkou.", "hints": ["Je přívěs samostatné vozidlo?"], "mnemonic": "Přívěs = vlastní značka.", "pitfall": "", "rule": "", "verified": false}, "RP0606379": {"topics": ["Vozidlo a doklady"], "short": "Nálepka o STK se lepí na zadní registrační značku.", "wrong": "Kontrolní nálepka technické kontroly patří na zadní tabulku registrační značky.", "why": "Policista ji tak vidí, když za tebou jede.", "hints": ["Kde ji policie snadno uvidí, když jede za tebou?"], "mnemonic": "STK nálepka = vzadu.", "pitfall": "", "rule": "", "verified": false}, "RP0606395": {"topics": ["Vozidlo a doklady", "Bezpečnost"], "short": "Minimální dezén je 1,6 mm (u mopedů 1 mm).", "wrong": "Pro osobní auto platí minimum 1,6 mm. Mopedy mají méně, 1 mm.", "why": "Při menším dezénu pneumatika neodvede vodu a na mokru hrozí aquaplaning. 1,6 mm je zákonné minimum, bezpečné je mít víc. Zimní pneumatiky musí mít aspoň 4 mm.", "hints": ["Je to víc nebo míň než 2 mm?", "Pro auta platí číslo s desetinnou čárkou."], "mnemonic": "Šestnáctka: 1,6 mm.", "pitfall": "", "rule": "Vyhláška o technických požadavcích na vozidla: hloubka hlavních dezénových drážek nejméně 1,6 mm (mopedy 1 mm).", "verified": false}, "RP0606371": {"topics": ["Vozidlo a doklady"], "short": "Na autě smějí být jen světla, která jsou pro něj předepsaná a povolená.", "wrong": "Nemůžeš si na auto přidělat jakákoli světla. Smí tam být jen ta, která jsou pro daný typ vozidla předepsaná nebo povolená.", "why": "Světla musí mít správnou barvu, počet a umístění, jinak by mátla ostatní řidiče.", "hints": ["Můžeš si na auto namontovat třeba modrá světla?"], "mnemonic": "Světla jen podle předpisu.", "pitfall": "", "rule": "", "verified": false}, "RP0606393": {"topics": ["Vozidlo a doklady", "Bezpečnost"], "short": "Na jedné nápravě musí být úplně shodné pneumatiky: rozměr, konstrukce, dezén, značka.", "wrong": "Pneumatiky na jedné nápravě musí být shodné ve všem. Jinak by auto táhlo do strany.", "why": "Rozdílné pneumatiky na jedné nápravě mají jiný úchop. Při brzdění by auto stáčelo na jednu stranu.", "hints": ["Která odpověď je nejpřísnější a nejúplnější?"], "mnemonic": "Jedna náprava = dvojčata.", "pitfall": "", "rule": "", "verified": false}, "RP0606472": {"topics": ["Vozidlo a doklady"], "short": "Odnímatelnou kouli sundáš, když ji zrovna nepoužíváš.", "wrong": "Odnímatelná tažná koule musí dolů, pokud s ní nic netáhneš. Při nárazu zezadu by byla nebezpečná.", "why": "Koule zakrývá registrační značku a při nárazu do tebe zezadu může zranit nebo poškodit druhé auto.", "hints": ["Proč by koule bez přívěsu mohla vadit?"], "mnemonic": "Netáhnu = koule dolů.", "pitfall": "", "rule": "", "verified": false}, "RP0812004": {"topics": ["Vozidlo a doklady"], "short": "S nebezpečnou závadou je auto technicky nezpůsobilé a nesmí jezdit.", "wrong": "Nebezpečná závada = auto nesmí do provozu. Žádná třicetidenní lhůta tu neplatí.", "why": "U vážné závady dostaneš lhůtu na opravu. U nebezpečné závady se s autem jezdit nesmí vůbec.", "hints": ["Co znamená slovo „nebezpečná“?"], "mnemonic": "Nebezpečná závada = auto stojí.", "pitfall": "30 dní je lhůta pro vážnou závadu, ne pro nebezpečnou.", "rule": "", "verified": false}, "RP0606409": {"topics": ["Vozidlo a doklady"], "short": "U registrační značky nesmí být nic, co zhorší její čitelnost.", "wrong": "Značka musí být vždy čitelná. Nápisy, rámečky ani ozdoby ji nesmí zhoršovat.", "why": "Kamery i policie musí značku přečíst. Proto kolem ní nesmí být nic, co by ji mohlo zakrýt nebo splést.", "hints": ["Co je na značce nejdůležitější?"], "mnemonic": "Značka musí být čitelná.", "pitfall": "", "rule": "", "verified": false}, "RP0606018": {"topics": ["Vozidlo a doklady"], "short": "Do řidičáku nesmíš nic psát ani nic měnit.", "wrong": "Řidičský průkaz je úřední doklad. Žádné zápisy, opravy ani úpravy. Změny dělá jen úřad.", "why": "Když se něco změní, třeba příjmení, oznámíš to úřadu a ten ti vydá nový průkaz.", "hints": ["Smíš si opravit chybu v občance propiskou?"], "mnemonic": "Doklad = nesahat.", "pitfall": "", "rule": "", "verified": false}, "RP0606024": {"topics": ["Vozidlo a doklady"], "short": "Změnu příjmení hlásíš do 5 pracovních dnů na obecní úřad obce s rozšířenou působností.", "wrong": "Řidičáky vydává obecní úřad obce s rozšířenou působností (tzv. „trojková“ obec). Tam se hlásí i změny.", "why": "Policie řidičáky nevydává. Ty vyřizuje odbor dopravy na úřadě obce s rozšířenou působností.", "hints": ["Kde sis vyřizovala řidičák?"], "mnemonic": "Řidičák = úřad, ne policie.", "pitfall": "", "rule": "", "verified": false}, "RP0606440": {"topics": ["Vozidlo a doklady"], "short": "S „béčkem“ nesmíš řídit auto s deseti místy k sezení.", "wrong": "Skupina B je pro auta do 3 500 kg a s nejvýše 9 místy včetně řidiče. Deset míst už je autobus.", "why": "Limity skupiny B: největší povolená hmotnost do 3 500 kg a nejvýš 8 míst k sezení kromě místa řidiče. Deset míst je víc, než skupina B dovoluje.", "hints": ["Kolik nejvíce míst může mít auto pro skupinu B?", "Váha 3 450 kg je pod limitem 3 500 kg."], "mnemonic": "Béčko: do 3,5 tuny a do 9 sedadel.", "pitfall": "Pozor na 3 450 kg. To je pod limitem, takže to s „béčkem“ řídit smíš.", "rule": "", "verified": false}, "RP1108026": {"topics": ["Vozidlo a doklady"], "short": "Po 12 bodech můžeš požádat o vrácení řidičáku nejdřív za rok od pozbytí.", "wrong": "Dvanáct bodů = rok bez řidičáku. Počítá se ode dne, kdy jsi oprávnění pozbyla.", "why": "Pro vrácení oprávnění musíš mimo jiné projít přezkoušením a dopravně psychologickým vyšetřením.", "hints": ["Jak dlouho se jezdí bez řidičáku po 12 bodech?"], "mnemonic": "12 bodů = 12 měsíců.", "pitfall": "", "rule": "", "verified": false}, "RP0606015": {"topics": ["Vozidlo a doklady"], "short": "Mezinárodní řidičák vydaný v ČR neplatí pro řízení v ČR.", "wrong": "Mezinárodní řidičský průkaz je na cesty do zahraničí. Doma potřebuješ normální český řidičák.", "why": "V ČR se prokazuješ českým řidičským průkazem. Mezinárodní je jen doplněk pro některé státy mimo EU.", "hints": ["K čemu slouží „mezinárodní“ řidičák?"], "mnemonic": "Mezinárodní = do ciziny.", "pitfall": "", "rule": "", "verified": false}, "RP0606021": {"topics": ["Vozidlo a doklady"], "short": "Změnu údajů v řidičáku hlásíš do 5 pracovních dnů na úřad obce s rozšířenou působností.", "wrong": "Platí stejné pravidlo jako u změny příjmení: 5 pracovních dnů, úřad obce s rozšířenou působností.", "why": "", "hints": ["Kdo vydává řidičské průkazy?"], "mnemonic": "Pět dní, úřad.", "pitfall": "", "rule": "", "verified": false}, "RP0904008": {"topics": ["První pomoc"], "short": "Srdeční masáž: asi 100 stlačení za minutu.", "wrong": "Správné tempo je zhruba 100 až 120 stlačení za minutu, skoro dvě za sekundu.", "why": "Pomůže rytmus písničky „Stayin’ Alive“, má kolem 100 úderů za minutu. Tlač rychle a nepřerušuj.", "hints": ["Je to víc nebo méně než jedno stlačení za sekundu?"], "mnemonic": "Sto za minutu, skoro dvě za sekundu.", "pitfall": "", "rule": "", "verified": false}, "RP1102028": {"topics": ["První pomoc"], "short": "Bezvědomí + dýchá: uvolni dýchací cesty a hlídej dech až do příjezdu záchranky.", "wrong": "Když dýchá, srdeční masáž nezačínáš. Ale nesmíš od něj odejít, protože dýchat může přestat.", "why": "Záklon hlavy uvolní dýchací cesty, aby jazyk nezapadl. Pořád kontroluj dech. Kdyby přestal dýchat, ihned začni resuscitovat.", "hints": ["Potřebuje masáž srdce člověk, který dýchá?", "Můžeš ho nechat bez dozoru?"], "mnemonic": "Dýchá → hlídám. Nedýchá → masíruju.", "pitfall": "", "rule": "", "verified": false}, "RP1102025": {"topics": ["První pomoc"], "short": "Zabodnutý předmět nevytahuješ. Ošetříš krvácení kolem.", "wrong": "Předmět v ráně ucpává cévy. Když ho vytáhneš, může začít silně krvácet. Nech ho tam.", "why": "Předmět zafixuj, aby se nehýbal, ošetři krvácení okolo, volej 155 a hlídej životní funkce.", "hints": ["Co se stane, když vytáhneš „špunt“?"], "mnemonic": "V ráně = zůstává v ráně.", "pitfall": "", "rule": "", "verified": false}, "RP0605237": {"topics": ["První pomoc", "Povinnosti řidiče"], "short": "První pomoc musí poskytnout každý, kdo to může udělat bez nebezpečí pro sebe nebo jiného.", "wrong": "Povinnost pomoci má každý, bez ohledu na věk nebo školení. Výjimka je jen tehdy, kdyby ses tím sama ohrozila.", "why": "Nikdo po tobě nečeká zázraky. Stačí zavolat 155, zabezpečit místo a udělat, co umíš.", "hints": ["Je potřeba speciální kurz, abys zavolala záchranku?"], "mnemonic": "Pomáhá každý, kdo může bezpečně.", "pitfall": "", "rule": "", "verified": false}, "RP1102026": {"topics": ["První pomoc"], "short": "Silné krvácení zastavíš hned přímým tlakem na ránu.", "wrong": "U masivního krvácení nemáš čas běžet pro lékárničku. Stlač ránu hned rukou nebo kusem oblečení.", "why": "Člověk může vykrvácet během pár minut. Přímý tlak je nejrychlejší a nejúčinnější pomoc. Obvaz přijde až potom.", "hints": ["Kolik máš času, když někdo silně krvácí?"], "mnemonic": "Krvácí → tlačím hned.", "pitfall": "", "rule": "", "verified": false}, "RP1102023": {"topics": ["První pomoc"], "short": "Resuscitaci nepřerušuješ, dokud nepřijede záchranka, člověk nezačne dýchat nebo nemůžeš dál.", "wrong": "Nejdůležitější je nepřestávat. Každé přerušení snižuje šanci na přežití.", "why": "Kontrolovat puls laik nemusí a ztrácí tím čas. Poměr 30:2 je doporučení, ale nejdůležitější je masáž nepřerušit.", "hints": ["Co je horší: nepřesný poměr, nebo pauza?"], "mnemonic": "Začala jsem → nepřestávám.", "pitfall": "", "rule": "", "verified": false}, "RP1102012": {"topics": ["První pomoc"], "short": "Motorkáři v bezvědomí, který nedýchá, sundávají přilbu opatrně dva lidé.", "wrong": "Když nedýc <script>
"use strict";
/* ============ DATA ============ */
const SRC = JSON.parse(document.getElementById('official-data').textContent);
const OFFICIAL_BASE = SRC.questions;           // OFFICIAL_QUESTION records (MD data, never edited by the learning layer)
const SOURCE_META = SRC.meta;
const LEARNING_BASE = JSON.parse(document.getElementById('learning-data').textContent); // LEARNING_CONTENT keyed by official code
const NAME = "Linda", VOC = "Lindo";

const AREAS = {
  52:{name:"Pravidla provozu", n:10, pts:2},
  53:{name:"Bezpečná jízda", n:4, pts:2},
  54:{name:"Dopravní značky", n:3, pts:1},
  55:{name:"Dopravní situace", n:3, pts:4},
  56:{name:"Podmínky provozu vozidel", n:2, pts:1},
  57:{name:"Související předpisy", n:2, pts:2},
  58:{name:"Zdravotnická příprava", n:1, pts:1}
};
const EXAM = {count:25, maxPts:50, passPts:43, minutes:30};
const TOPICS = ["Křižovatky","Přednost","Značky a signály","Chodci a cyklisté","Bezpečnost","Povinnosti řidiče","Pojmy","Vozidlo a doklady","První pomoc"];

/* ============ STORAGE ============ */
const KEY = "autoskola-linda-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
let S = load() || {q:{}, xp:0, streak:0, lastDay:null, today:{day:null, xp:0}, goal:50, voice:true, admin:{learning:{}, inactive:{}}, exams:[]};
S.admin = S.admin || {learning:{}, inactive:{}};

const todayStr = () => new Date().toISOString().slice(0,10);
S.admin.key = S.admin.key || {};
OFFICIAL_BASE.forEach(q => { q.keyFromData = !!q.correct; if(S.admin.key[q.code]) q.correct = S.admin.key[q.code] });
// a question is used only once its correct answer is known (from data or set in admin "Klíč odpovědí")
function official(){ return OFFICIAL_BASE.filter(q => q.correct && q.active !== false && !S.admin.inactive[q.code]) }
const GENERIC = {
  55:{topics:["Křižovatky","Přednost"], hints:["Podívej se nejdřív, jestli provoz řídí semafor, policista nebo dopravní značky.","Teď se podívej, kam jede tvoje vozidlo (vozidlo z výhledu) a kam ostatní.","Když nic neurčují značky ani semafor, platí pravá ruka. Při odbočování vlevo mysli na protijedoucí."]},
  54:{topics:["Značky a signály"], hints:["Podívej se na tvar značky: trojúhelník varuje, kruh zakazuje nebo přikazuje, čtverec nebo obdélník informuje.","Všimni si barev a symbolu uvnitř značky. Co ti připomíná?"]}
};
const AREA_OF = {}; OFFICIAL_BASE.forEach(q => AREA_OF[q.code] = q.area);
function learning(code){ return Object.assign({}, GENERIC[AREA_OF[code]] || {}, LEARNING_BASE[code] || {}, S.admin.learning[code] || {}) }
function qs(code){ return S.q[code] || (S.q[code] = {seen:0, right:0, wrong:0, hints:0, hintRight:0, time:0, last:0, streak:0, box:0, due:0, lapses:0}) }

/* ============ ADAPTIVE ENGINE (spaced repetition, Leitner boxes) ============ */
// box 0..5. Interval after a correct answer at that box:
const IVL = [0, 10*60e3, 24*3600e3, 3*24*3600e3, 7*24*3600e3, 21*24*3600e3];
function status(code){
  const s = S.q[code];
  if(!s || !s.seen) return "NOVÁ";
  if(s.box === 0 || (s.lapses >= 2 && s.box <= 1)) return "PROBLEMATICKÁ";
  if(s.box <= 2) return "UČÍM SE";
  if(s.box <= 4) return "UMÍM";
  return "ZVLÁDNUTO";
}
function record(code, correct, usedHint, ms, mode){
  const s = qs(code), now = Date.now();
  s.seen++; s.last = now; s.time += ms;
  if(usedHint) s.hints++;
  if(correct){
    s.right++; s.streak++;
    if(usedHint){ s.hintRight++; s.box = Math.max(1, Math.min(s.box, 1)); }   // hint = no promotion past "učím se"
    else s.box = Math.min(5, s.box + 1);
    s.due = now + IVL[s.box];
  } else {
    s.wrong++; s.streak = 0; s.lapses++;
    s.box = 0; s.due = now;                       // back to the start, comes back soon
  }
  // XP + daily goal
  const gain = mode === "exam" ? 0 : (correct ? (usedHint ? 5 : 10) : 2);
  S.xp += gain; bumpDay(gain);
  save();
}
function bumpDay(gain){
  const t = todayStr();
  if(S.today.day !== t){ S.today = {day:t, xp:0}; }
  S.today.xp += gain;
  if(S.lastDay !== t && gain > 0){
    const y = new Date(Date.now() - 864e5).toISOString().slice(0,10);
    S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
    S.lastDay = t;
  }
}
// priority: higher = ask sooner
function priority(code, now){
  const s = S.q[code];
  if(!s || !s.seen) return 50;                                  // new
  const overdue = Math.max(0, now - s.due) / 864e5;             // days overdue
  if(now < s.due) return 5 - s.box;                             // not due yet: low, only as filler
  return 100 + s.lapses*15 + (5 - s.box)*10 + Math.min(overdue, 30);
}
function pickLesson(n, filter){
  const now = Date.now();
  let pool = official().filter(q => !filter || filter(q));
  const scored = pool.map(q => ({q, p: priority(q.code, now) + Math.random()*4}));
  scored.sort((a,b) => b.p - a.p);
  // mix: due/problem first, then new, keep at least ~1 review of known items for long-term memory
  const due = scored.filter(x => x.p >= 100), fresh = scored.filter(x => x.p >= 50 && x.p < 100), rest = scored.filter(x => x.p < 50);
  const out = [];
  const take = arr => { while(arr.length && out.length < n) out.push(arr.shift().q) };
  const nDue = Math.min(due.length, Math.ceil(n*0.6));
  for(let i=0;i<nDue;i++) out.push(due.shift().q);
  if(rest.length && out.length < n) out.push(rest.splice(Math.floor(Math.random()*Math.min(rest.length,5)),1)[0].q);
  take(fresh); take(due); take(rest);
  return shuffle(out);
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

/* ============ METRICS ============ */
function pKnow(code){ // estimated probability Linda answers correctly today
  const s = S.q[code]; if(!s || !s.seen) return 0;
  const base = [0.25,0.5,0.7,0.85,0.93,0.97][s.box];
  const acc = (s.right - s.hintRight*0.5) / s.seen;
  return Math.max(0, Math.min(1, base*0.7 + acc*0.3));
}
function readiness(){
  // weighted by how many points each area is worth in the real exam
  let tot = 0, got = 0;
  for(const [id,a] of Object.entries(AREAS)){
    const list = official().filter(q => String(q.area) === id);
    if(!list.length) continue;
    const w = a.n * a.pts;
    const m = list.reduce((s,q) => s + pKnow(q.code), 0) / list.length;
    tot += w; got += w*m;
  }
  return tot ? Math.round(100*got/tot) : 0;
}
function topicStats(){
  return TOPICS.map(t => {
    const list = official().filter(q => (learning(q.code).topics||[]).includes(t));
    let r=0,w=0,h=0; list.forEach(q => { const s=S.q[q.code]; if(s){ r+=s.right; w+=s.wrong; h+=s.hintRight } });
    const n = r + w;
    return {t, count:list.length, answered:n, pct: n ? Math.round(100*(r - h*0.5)/n) : null};
  }).filter(x => x.count);
}

/* ============ VOICE ============ */
let VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^cs/i.test(v.lang));
  const male = vs.find(v => /anton|jakub|ond|petr|male|muž|tomas|tomáš|vlad/i.test(v.name));
  VOICE = male || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!S.voice || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "cs-CZ"; if(VOICE) u.voice = VOICE;
    u.rate = 0.9;                       // calm, slower
    u.pitch = (VOICE && /anton|jakub|ond|petr|male|muž|tomas|tomáš|vlad/i.test(VOICE.name)) ? 1 : 0.8;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopVoice(){ try{ speechSynthesis.cancel() }catch(e){} }

/* ============ UI HELPERS ============ */
const $app = document.getElementById('app');
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRAISE = ["Přesně tak.","Výborně.","Ano, správně.","Dobře.","Přesně."];
const CALM = ["Nevadí. Tohle si vysvětlíme.","Nevadí. Podíváme se na to spolu.","To nic. Tohle si teď vysvětlíme."];
let lastPraise = -1;
function praise(code){
  const s = S.q[code];
  if(s && s.right >= 2 && Math.random() < .35) return "Tohle už znáš.";
  let i; do{ i = Math.floor(Math.random()*PRAISE.length) }while(i === lastPraise);
  lastPraise = i; return PRAISE[i];
}
function mediaHtml(q){
  const m = q.media; if(!m || !m.src) return "";
  const fail = `onerror="this.parentElement.innerHTML='<p class=&quot;small&quot; style=&quot;padding:12px&quot;>Obrázek nebo video se nenačetlo. <a href=&quot;${m.src}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>Otevřít na eTesty</a></p>'"`;
  if(m.type === "video") return `<div class="media"><video src="${m.src}" playsinline muted autoplay loop controls preload="auto" ${fail}></video></div>`;
  return `<div class="media"><img src="${m.src}" alt="Obrázek k otázce ${esc(q.code)}" ${fail}></div>`;
}
function ansHtml(a){ return a.img ? `<img src="${a.img}" alt="">` + (a.text ? `<span>${esc(a.text)}</span>` : "") : `<span>${esc(a.text)}</span>` }

/* ============ ROUTER ============ */
let view = {name:"home"};
function go(v){ stopVoice(); clearInterval(timerId); view = v; render(); window.scrollTo(0,0) }
function render(){
  if(location.hash === "#admin" && view.name === "home") view = {name:"admin"};
  ({home, lesson, exam, examResult, mistakes, admin, keymode, done:doneView, about})[view.name]();
}

/* ============ HOME ============ */
function home(){
  if(S.today.day !== todayStr()) S.today = {day:todayStr(), xp:0};
  const r = readiness(), on = Math.round(r/10);
  const total = official().length;
  const counts = {}; official().forEach(q => { const st = status(q.code); counts[st] = (counts[st]||0)+1 });
  const weak = topicStats().filter(x => x.pct !== null).sort((a,b) => a.pct - b.pct)[0];
  const seenAny = Object.keys(S.q).length > 0;
  const streakAlive = S.lastDay === todayStr() || S.lastDay === new Date(Date.now()-864e5).toISOString().slice(0,10);
  $app.innerHTML = `
  <div class="top">
    <span class="chip" title="Série dní">🔥 ${streakAlive ? S.streak : 0}</span>
    <span class="chip" title="Body za učení">${S.xp} XP</span>
    <span class="spacer"></span>
    <button class="chip" id="v" aria-label="Hlas">${S.voice ? "🔊" : "🔇"}</button>
  </div>
  <div class="stack">
    <div class="hello"><h1>Ahoj ${VOC}!</h1><p>${seenAny ? "Pokračujeme tam, kde jsme skončili." : "Naučíme se pravidla tak, abys jim rozuměla. Test pak přijde sám."}</p></div>
    <div class="ready">
      <div class="row"><span class="label">Připravenost na zkoušku</span><span class="spacer"></span><span class="big">${r}&nbsp;%</span></div>
      <div class="meter">${Array.from({length:10},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join("")}</div>
      <div class="row" style="margin-top:12px"><span class="label">Dnešní cíl</span><span class="spacer"></span><span class="mono small">${Math.min(S.today.xp,S.goal)} / ${S.goal} XP</span></div>
      <div class="goal"><b style="width:${Math.min(100,100*S.today.xp/S.goal)}%"></b></div>
    </div>
    ${weak && weak.pct < 85 ? `<div class="coach"><p><b>Největší problém máš zatím s tématem ${esc(weak.t.toLowerCase())}.</b> Dáme si krátkou pětiminutovou lekci?</p><button class="btn" id="weak">Začít</button></div>`

/* ============ LESSON ============ */
function startLesson(title, list){
  if(!list.length) return;
  go({name:"lesson", title, queue:list.slice(), total:list.length, doneCount:0, right:0, xp0:S.xp, wrongInSession:{}});
}
function lesson(){
  const v = view, q = v.queue[0];
  if(!q){ return go({name:"done", title:v.title, total:v.total, right:v.right, xp:S.xp - v.xp0}) }
  const L = learning(q.code);
  v.cur = {code:q.code, hintLevel:0, t0:Date.now(), answered:false, choice:null};
  const pct = 100 * v.doneCount / (v.doneCount + v.queue.length);
  $app.innerHTML = `
  <div class="lesson">
    <div class="lbar"><button class="x" id="close" aria-label="Ukončit lekci">×</button><div class="prog"><b style="width:${pct}%"></b></div>
      ${(L.hints||[]).length ? `<button class="hintbtn" id="hint">💡 Nápověda</button>` : ""}</div>
    <div class="qmeta"><span class="tag">${esc(AREAS[q.area]?.name||"")}</span>${v.wrongInSession[q.code] ? `<span class="tag warn">Ještě jednou</span>` : ""}<span class="tag mono">${esc(q.code)}</span></div>
    ${mediaHtml(q)}
    <h2 class="qtext">${esc(q.text)}</h2>
    <div id="hintbox"></div>
    <div class="answers">${q.answers.map(a => `<button class="ans" data-k="${a.key}"><span class="k">${a.key}</span>${ansHtml(a)}</button>`).join("")}</div>
    <div class="spacer"></div>
    <div id="sheet"></div>
  </div>`;
  document.getElementById("close").onclick = () => go({name:"home"});
  const hb = document.getElementById("hint");
  if(hb) hb.onclick = () => {
    const hints = L.hints || [];
    if(v.cur.answered || v.cur.hintLevel >= hints.length) return;
    v.cur.hintLevel++;
    document.getElementById("hintbox").innerHTML = `<div class="hint">${hints.slice(0, v.cur.hintLevel).map(h=>`<p>💡 ${esc(h)}</p>`).join("")}</div>`;
    if(v.cur.hintLevel >= hints.length){ hb.disabled = true; hb.style.opacity = .5 }
  };
  $app.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(q, b.dataset.k));
}
function answer(q, key){
  const v = view; if(v.cur.answered) return;
  v.cur.answered = true;
  const correct = key === q.correct, used = v.cur.hintLevel > 0, ms = Date.now() - v.cur.t0;
  record(q.code, correct, used, ms, "learn");
  $app.querySelectorAll(".ans").forEach(b => {
    b.disabled = true;
    if(b.dataset.k === q.correct) b.classList.add("right");
    else if(b.dataset.k === key) b.classList.add("wrong");
  });
  const hb = document.getElementById("hint"); if(hb) hb.hidden = true;
  v.queue.shift(); v.doneCount++;
  if(correct){ v.right++ }
  else if(!v.wrongInSession[q.code] || v.wrongInSession[q.code] < 2){
    // don't ask again immediately: put it back after ~3 other questions
    v.wrongInSession[q.code] = (v.wrongInSession[q.code]||0) + 1;
    v.queue.splice(Math.min(3, v.queue.length), 0, q);
  }
  showSheet(q, correct, key);
}
function showSheet(q, correct, key){
  const L = learning(q.code);
  const react = correct ? praise(q.code) : CALM[Math.floor(Math.random()*CALM.length)];
  const short = correct ? (L.short || "") : (L.wrong || L.short || "");
  const voiceText = correct ? (L.voiceRight || `${react} ${L.short||""}`) : (L.voiceWrong || `${react} ${L.wrong || L.short || ""}`);
  const el = document.getElementById("sheet");
  el.innerHTML = `
  <div class="sheet ${correct?'good':'bad'}">
    <div class="react">${esc(react)}</div>
    ${short ? `<p>${esc(short)}</p>` : `<p>Správná odpověď je ${esc(q.correct)}.</p>`}
    ${!correct && L.mnemonic ? `<div class="memo"><span class="label">Jak si to zapamatovat</span>${esc(L.mnemonic)}</div>` : ""}
    <div id="more"></div>
    <div class="row">
      ${L.why || L.rule ? `<button class="btn ghost small" id="why">${correct ? "Proč?" : "Ukaž mi proč"}</button>` : ""}
      ${L.scene ? `<button class="btn ghost small" id="show">Ukaž na křižovatce</button>` : ""}
      <span class="spacer"></span>
      <button class="iconbtn" id="rep" aria-label="Zopakovat vysvětlení">🔊</button>
      <button class="iconbtn" id="mute" aria-label="Vypnout hlas">${S.voice?"🔇":"🔈"}</button>
    </div>
    <button class="btn ${correct?'ok':''}" id="next">Pokračovat</button>
  </div>`;
  speak(voiceText);
  const why = document.getElementById("why");
  if(why) why.onclick = () => {
    document.getElementById("more").innerHTML = `<div class="detail">
      ${L.why ? `<div><h4>Proč</h4><p>${esc(L.why)}</p></div>` : ""}
      ${correct && L.mnemonic ? `<div><h4>Jak si to zapamatovat</h4><p>${esc(L.mnemonic)}</p></div>` : ""}
      ${L.pitfall ? `<div><h4>Pozor na</h4><p>${esc(L.pitfall)}</p></div>` : ""}
      ${L.rule ? `<div><h4>Pravidlo</h4><p>${esc(L.rule)}</p></div>` : ""}
      ${L.verified ? "" : `<p class="unver">Vysvětlení zatím neověřil instruktor.</p>`}
    </div>`;
    why.hidden = true;
    if(L.why) speak(L.why);
  };
  const show = document.getElementById("show");
  if(show) show.onclick = () => { const m = document.getElementById("more"); m.innerHTML = sceneHtml(L.scene); playScene(m.querySelector("svg"), L.scene) };
  document.getElementById("rep").onclick = () => { const s = S.voice; S.voice = true; speak(voiceText); S.voice = s };
  const mute = document.getElementById("mute");
  mute.onclick = () => { S.voice = !S.voice; save(); if(!S.voice) stopVoice(); mute.textContent = S.voice?"🔇":"🔈" };
  document.getElementById("next").onclick = () => { stopVoice(); render() };
  el.scrollIntoView({behavior:"smooth", block:"end"});
}
