/* ============ INTERSECTION SCENE (our own schematic, not an MD image) ============ */
// scene: {main:["S","N"]?, cars:[{id,from,to,me?,label?,kind?}], order:[ids], caption}
const ENTRY = {S:[165,300],N:[135,0],E:[300,135],W:[0,165]};
const STOP  = {S:[165,192],N:[135,108],E:[192,135],W:[108,165]};
const EXIT0 = {N:[165,108],S:[135,192],E:[192,165],W:[108,135]};
const EXIT  = {N:[165,-40],S:[135,340],E:[340,165],W:[-40,135]};
function carPath(c){
  const st = STOP[c.from], e0 = EXIT0[c.to], e1 = EXIT[c.to], en = ENTRY[c.from];
  const back = [st[0] + (en[0]-st[0])*0.38, st[1] + (en[1]-st[1])*0.38];
  const vertical = c.from === "S" || c.from === "N";
  const straight = (c.from==="S"&&c.to==="N")||(c.from==="N"&&c.to==="S")||(c.from==="E"&&c.to==="W")||(c.from==="W"&&c.to==="E");
  const ctrl = straight ? [(st[0]+e0[0])/2,(st[1]+e0[1])/2] : (vertical ? [st[0], e0[1]] : [e0[0], st[1]]);
  return `M${back} L${st} Q${ctrl} ${e0} L${e1}`;
}
function sceneHtml(sc){
  const main = sc.main || [];
  const road = `<rect x="110" y="0" width="80" height="300" fill="var(--asphalt)"/><rect x="0" y="110" width="300" height="80" fill="var(--asphalt)"/>`;
  const mainBand = main.length ? main.map(d => {
    const r = {N:"M150 0 V110",S:"M150 300 V190",E:"M300 150 H190",W:"M0 150 H110"}[d];
    return `<path d="${r}" stroke="var(--gold)" stroke-width="6" stroke-opacity=".55" fill="none"/>`}).join("") + `<path d="M${main.map(d=>({N:"150 110",S:"150 190",E:"190 150",W:"110 150"})[d]).join(" L")}" stroke="var(--gold)" stroke-width="6" stroke-opacity=".55" fill="none"/>` : "";
  const lanes = `<path d="M150 0 V108 M150 192 V300 M0 150 H108 M192 150 H300" stroke="var(--lane)" stroke-width="2" stroke-dasharray="10 9" fill="none"/>`;
  const cars = sc.cars.map((c,i) => `
    <path id="p-${c.id}" d="${carPath(c)}" fill="none" stroke="${c.me?'var(--sign)':'var(--muted)'}" stroke-width="2.5" stroke-dasharray="5 5" opacity=".9" marker-end="url(#arr)"/>
    <g id="car-${c.id}"><rect x="-11" y="-17" width="22" height="34" rx="6" fill="${c.me?'var(--sign)':(c.kind==='bike'?'var(--warn)':'var(--surface)')}" stroke="var(--ink)" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="900" font-family="var(--display)" fill="${c.me?'var(--sign-ink)':'var(--ink)'}">${esc(c.label || (c.me?"Ty":String.fromCharCode(65+i)))}</text></g>`).join("");
  return `<div class="scene"><svg viewBox="-10 -10 320 320" role="img" aria-label="Schéma křižovatky">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
    <rect x="-10" y="-10" width="320" height="320" fill="var(--bg)"/>${road}${mainBand}${lanes}${cars}</svg>
    <p class="cap">${esc(sc.caption || "")}</p><p class="cap">Naše zjednodušené schéma (není oficiální obrázek MD).</p>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ghost small" id="replay">Přehrát znovu</button></div></div>`;
}
function playScene(svg, sc){
  if(!svg) return;
  const order = sc.order || sc.cars.map(c=>c.id);
  const paths = {}, cars = {};
  sc.cars.forEach(c => { paths[c.id] = svg.querySelector("#p-"+c.id); cars[c.id] = svg.querySelector("#car-"+c.id) });
  const place = (id, t) => {
    const p = paths[id], L = p.getTotalLength(), a = p.getPointAtLength(t*L), b = p.getPointAtLength(Math.min(L, t*L+1));
    const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI + 90;
    cars[id].setAttribute("transform", `translate(${a.x} ${a.y}) rotate(${ang})`);
  };
  let raf;
  const run = () => {
    cancelAnimationFrame(raf);
    Object.keys(paths).forEach(id => place(id, 0));
    const dur = 1500, gap = 250, t0 = performance.now() + 400;
    const step = now => {
      order.forEach((id,i) => { const t = (now - t0 - i*(dur+gap)) / dur; place(id, Math.max(0, Math.min(.999, t))) });
      if(now - t0 < order.length*(dur+gap)) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };
  run();
  const rb = svg.parentElement.querySelector("#replay"); if(rb) rb.onclick = run;
}

/* ============ EXAM (no hints, no explanations until the end) ============ */
let timerId;
function buildExam(){
  const out = [];
  for(const [id,a] of Object.entries(AREAS)){
    const list = shuffle(official().filter(q => String(q.area) === id));
    out.push(...list.slice(0, a.n));
  }
  return out;
}
function exam(){
  const v = view;
  if(!v.qs){
    v.qs = buildExam(); v.answers = {}; v.i = 0; v.end = Date.now() + EXAM.minutes*60e3; v.t0 = Date.now();
  }
  const q = v.qs[v.i];
  const left = () => { const s = Math.max(0, Math.round((v.end - Date.now())/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` };
  $app.innerHTML = `
  <div class="lesson">
    <div class="lbar"><button class="x" id="close" aria-label="Ukončit test">×</button><div class="prog"><b style="width:${100*Object.keys(v.answers).length/v.qs.length}%"></b></div><span class="timer" id="tm">${left()}</span></div>
    <div class="qmeta"><span class="tag mono">${v.i+1} / ${v.qs.length}</span><span class="tag">${esc(AREAS[q.area]?.name||"")}</span><span class="tag mono">${q.points} b.</span></div>
    ${mediaHtml(q)}
    <h2 class="qtext">${esc(q.text)}</h2>
    <div class="answers">${q.answers.map(a => `<button class="ans ${v.answers[q.code]===a.key?'sel':''}" data-k="${a.key}"><span class="k">${a.key}</span>${ansHtml(a)}</button>`).join("")}</div>
    <div class="spacer"></div>
    <div class="row"><button class="btn ghost" id="prev" ${v.i===0?"disabled":""}>Zpět</button>
      ${v.i < v.qs.length-1 ? `<button class="btn" id="nx">Další</button>` : `<button class="btn ok" id="fin">Ukončit test</button>`}</div>
    ${v.qs.length < EXAM.count ? `<p class="note">Zatím bez otázek s obrázky (značky, dopravní situace). Test má proto ${v.qs.length} otázek místo ${EXAM.count} a hranice úspěchu je přepočtená na ${Math.round(100*EXAM.passPts/EXAM.maxPts)} % bodů, stejně jako 43 z 50.</p>` : ""}
  </div>`;
  document.getElementById("close").onclick = () => go({name:"home"});
  $app.querySelectorAll(".ans").forEach(b => b.onclick = () => {
    v.answers[q.code] = b.dataset.k;
    $app.querySelectorAll(".ans").forEach(x => x.classList.toggle("sel", x === b));
    $app.querySelector(".prog b").style.width = (100*Object.keys(v.answers).length/v.qs.length) + "%";
  });
  const p = document.getElementById("prev"); p.onclick = () => { if(v.i>0){ v.i--; exam() } };
  const n = document.getElementById("nx"); if(n) n.onclick = () => { v.i++; exam() };
  const f = document.getElementById("fin"); if(f) f.onclick = finishExam;
  clearInterval(timerId);
  timerId = setInterval(() => { const tm = document.getElementById("tm"); if(tm) tm.textContent = left(); if(Date.now() >= v.end) finishExam() }, 1000);
}
function finishExam(){
  clearInterval(timerId);
  const v = view; let pts = 0;
  const wrong = [];
  v.qs.forEach(q => {
    const a = v.answers[q.code], ok = a === q.correct;
    if(ok) pts += q.points; else wrong.push({q, a});
    record(q.code, ok, false, 0, "exam");
  });
  const max = v.qs.reduce((s,q)=>s+q.points,0);
  const need = Math.ceil(max * EXAM.passPts / EXAM.maxPts);
  const res = {date:Date.now(), pts, max, need, pass: pts >= need, mins: Math.round((Date.now()-v.t0)/60000)};
  S.exams.push(res); S.xp += 20; bumpDay(20); save();
  go({name:"examResult", res, wrong});
}

  </div>`;
  const fx = document.getElementById("fix"); if(fx) fx.onclick = () => startLesson("Chyby z testu", wrong.map(w=>w.q));

/* ============ MOJE CHYBY ============ */
function mistakes(){
  const st = topicStats();
  const answered = st.filter(x => x.pct !== null);
  const weak = answered.slice().sort((a,b)=>a.pct-b.pct)[0];
  const color = p => p === null ? "var(--line)" : p >= 85 ? "var(--ok)" : p >= 70 ? "var(--gold)" : "var(--warn)";
  const prob = official().filter(q => status(q.code) === "PROBLEMATICKÁ");
  $app.innerHTML = `<div class="stack">
    <div class="lbar"><button class="x" id="close" aria-label="Zpět">×</button><h2>Moje chyby</h2></div>
    <div class="bars">
      ${st.map(x => `<div class="bar"><span>${esc(x.t)}</span><span class="n">${x.pct===null?"–":x.pct+" %"}</span><div class="t"><b style="width:${x.pct||0}%;background:${color(x.pct)}"></b></div></div>`).join("")}
    </div>
    ${weak ? `<div class="coach"><p><b>${weak.pct >= 85 ? `Jde ti to dobře. Nejslabší je zatím ${weak.t.toLowerCase()}.` : `Největší problém máš zatím s tématem ${weak.t.toLowerCase()}.`}</b> Dáme si krátkou pětiminutovou lekci.</p><button class="btn" id="go">Začít</button></div>`
      : `<div class="coach"><p>Zatím nevím, co ti nejde. Udělej pár lekcí a tady uvidíš, kde se zaseknout můžeš.</p></div>`}
    ${prob.length ? `<button class="btn ghost" id="prob">Procvičit problematické otázky (${prob.length})</button>` : ""}
    <p class="small">Procenta = podíl správných odpovědí v tématu. Správná odpověď s nápovědou se počítá jen napůl.</p>
  </div>`;
  document.getElementById("close").onclick = () => go({name:"home"});
  const g = document.getElementById("go"); if(g) g.onclick = () => startLesson("Lekce: " + weak.t, pickLesson(6, q => (learning(q.code).topics||[]).includes(weak.t)));
  const p = document.getElementById("prob"); if(p) p.onclick = () => startLesson("Moje chyby", shuffle(prob).slice(0,10));
}

/* ============ ABOUT ============ */
function about(){
  $app.innerHTML = `<div class="stack">
    <div class="lbar"><button class="x" id="close" aria-label="Zpět">×</button><h2>O aplikaci</h2></div>
    <p>Otázky jsou skutečné otázky Ministerstva dopravy z Elektronického věstníku eTesty (verze ${esc(SOURCE_META.bulletinVersion)}), skupina B, s oficiálními kódy.</p>
    <p class="note">Prototyp: znění je přepsané z online věstníku a správné odpovědi jsme určili podle zákona. Ještě je musí porovnat instruktor s oficiálním klíčem. Otázky s obrázky (značky, dopravní situace) zatím chybí.</p>
    <p>Vysvětlení, nápovědy a pomůcky jsou naše vlastní vzdělávací vrstva. U nezkontrolovaných vysvětlení to aplikace uvádí.</p>
    <p>Zkušební test: ${EXAM.count} otázek, ${EXAM.minutes} minut, max. ${EXAM.maxPts} bodů, na úspěch ${EXAM.passPts} bodů.</p>
    <p class="small">Hlas: ${VOICE ? esc(VOICE.name) : "český hlas v telefonu nenalezen"}. Hlas závisí na hlasech nainstalovaných v telefonu.</p>
    <p class="small">Postup se ukládá jen v tomto prohlížeči v tomhle telefonu.</p>
    <p class="small">Zdroj: <a href="${esc(SOURCE_META.url)}" target="_blank" rel="noopener">${esc(SOURCE_META.url)}</a></p>
    <button class="btn ghost" id="reset">Smazat můj postup</button>
    <div id="confirm"></div>
  </div>`;
  document.getElementById("close").onclick = () => go({name:"home"});
  document.getElementById("reset").onclick = () => {
    document.getElementById("confirm").innerHTML = `<div class="coach"><p>Opravdu smazat celý postup?</p><div class="row"><button class="btn small" id="yes">Ano, smazat</button><button class="btn ghost small" id="no">Ne</button></div></div>`;
    document.getElementById("yes").onclick = () => { const adm = S.admin; S = {q:{}, xp:0, streak:0, lastDay:null, today:{day:null,xp:0}, goal:50, voice:true, admin:adm, exams:[]}; save(); go({name:"home"}) };
    document.getElementById("no").onclick = () => document.getElementById("confirm").innerHTML = "";
  };
}

/* ============ ADMIN (#admin) ============ */
function admin(){
  const v = view; v.filter = v.filter || "all"; v.qtext = v.qtext || "";
  const list = OFFICIAL_BASE.filter(q => (v.filter==="all" || String(q.area)===v.filter) && (!v.qtext || (q.code+q.text).toLowerCase().includes(v.qtext.toLowerCase())));
  const fields = [["short","Stručně (po správné odpovědi)"],["wrong","Vysvětlení po chybě"],["why","Proč"],["mnemonic","Jak si to zapamatovat"],["pitfall","Pozor na"],["rule","Pravidlo"],["voiceRight","Hlas – správně"],["voiceWrong","Hlas – špatně"]];
  $app.innerHTML = `<div class="stack">
    <div class="lbar"><button class="x" id="close" aria-label="Zpět">×</button><h2>Administrace</h2></div>
    <p class="small">Skupina B · ${OFFICIAL_BASE.length} otázek · věstník ${esc(SOURCE_META.bulletinVersion)}. Úpravy se ukládají v tomto prohlížeči; tlačítkem Exportovat je zkopíruješ a pošleš k trvalému uložení.</p>
    <div class="row"><select id="f"><option value="all">Všechny okruhy</option>${Object.entries(AREAS).map(([id,a])=>`<option value="${id}" ${v.filter===id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
    <input class="adm-io" id="s" type="search" placeholder="Hledat kód nebo text" value="${esc(v.qtext)}">
    <div class="row"><button class="btn small" id="exp">Exportovat úpravy</button><button class="btn ghost small" id="imp">Importovat</button></div>
    <textarea class="adm-io" id="io" rows="3" placeholder="Sem se zkopíruje export / sem vlož JSON k importu" hidden></textarea>
    ${(() => { const miss = OFFICIAL_BASE.filter(q => !q.correct); return miss.length ? `<button class="btn" id="keymode">Klíč odpovědí: doplnit ${miss.length} otázek</button><p class="small">Otázky s obrázkem nebo videem se Lindě ukážou až po doplnění správné odpovědi. Správnou odpověď najdeš na eTesty pod tlačítkem „Zobrazit správnou odpověď“.</p>` : "" })()}
    ${list.map(q => { const L = learning(q.code), off = q.active===false || S.admin.inactive[q.code];
      return `<div class="adm-item ${off?'off':''}" data-c="${esc(q.code)}">
        <div class="row" style="flex-wrap:wrap"><b class="mono">${esc(q.code)}</b><span class="tag">${esc(AREAS[q.area]?.name)}</span><span class="tag mono">${q.points} b.</span><span class="tag ${q.correct?'':'warn'}">${q.correct ? "správně " + esc(q.correct) : "chybí klíč"}</span></div>
        <div class="small">Zdroj: ${esc(q.source?.bulletin || SOURCE_META.bulletinVersion)}${q.source?.validFrom ? " · platí od " + esc(q.source.validFrom) : ""}${q.media?.src ? " · " + esc(q.media.type) : ""}</div>
        <b>${esc(q.text)}</b>
        <div class="small">${q.answers.map(a=>`${a.key}) ${esc(a.text||"[obrázek]")}`).join("<br>")}</div>
        <details><summary class="small">Upravit vysvětlení</summary><div class="stack" style="margin-top:8px">
          ${fields.map(([k,lab]) => `<label for="${q.code}-${k}">${lab}</label><textarea id="${q.code}-${k}" data-k="${k}">${esc(L[k]||"")}</textarea>`).join("")}
          <label for="${q.code}-hints">Nápověda (každá úroveň na nový řádek)</label><textarea id="${q.code}-hints" data-k="hints">${esc((L.hints||[]).join("\n"))}</textarea>
          <label for="${q.code}-topics">Témata (čárkou)</label><input type="text" id="${q.code}-topics" data-k="topics" value="${esc((L.topics||[]).join(", "))}">
        </div></details>
        <div class="row" style="flex-wrap:wrap">
          <label class="row" style="text-transform:none;letter-spacing:0;font-size:15px"><input type="checkbox" data-k="verified" ${L.verified?"checked":""}> Vysvětlení ověřeno</label>
          <label class="row" style="text-transform:none;letter-spacing:0;font-size:15px"><input type="checkbox" data-off ${off?"checked":""}> Deaktivovat</label>
          <span class="spacer"></span><button class="btn small" data-save>Uložit</button>
        </div>
      </div>` }).join("")}
  </div>`;
  document.getElementById("close").onclick = () => { history.replaceState(null,"",location.pathname); go({name:"home"}) };
  document.getElementById("f").onchange = e => { v.filter = e.target.value; admin() };
  document.getElementById("s").onchange = e => { v.qtext = e.target.value; admin() };
  $app.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
    const box = b.closest(".adm-item"), code = box.dataset.c, o = {};
    box.querySelectorAll("[data-k]").forEach(el => {
      const k = el.dataset.k;
      if(k === "verified") o.verified = el.checked;
      else if(k === "hints") o.hints = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(k === "topics") o.topics = el.value.split(",").map(s=>s.trim()).filter(Boolean);
      else o[k] = el.value.trim();
    });
    S.admin.learning[code] = o;
    if(box.querySelector("[data-off]").checked) S.admin.inactive[code] = true; else delete S.admin.inactive[code];
    save(); b.textContent = "Uloženo ✓"; box.classList.toggle("off", !!S.admin.inactive[code]);
  });
  const km = document.getElementById("keymode"); if(km) km.onclick = () => go({name:"keymode"});
  const io = document.getElementById("io");
  document.getElementById("exp").onclick = async () => {
    io.hidden = false; io.value = JSON.stringify(S.admin, null, 1); io.select();
    try{ await navigator.clipboard.writeText(io.value) }catch(e){}
  };
  document.getElementById("imp").onclick = () => {
    if(io.hidden){ io.hidden = false; io.value = ""; io.placeholder = "Vlož JSON a klepni znovu na Importovat"; return }
    try{ const d = JSON.parse(io.value); S.admin = {learning:d.learning||{}, inactive:d.inactive||{}, key:d.key||{}}; OFFICIAL_BASE.forEach(q => { if(S.admin.key[q.code]) q.correct = S.admin.key[q.code] }); save(); admin() }catch(e){ io.value = "Tohle není platný JSON export. Zkopíruj celý text exportu." }
  };
}

function keymode(){
  const miss = OFFICIAL_BASE.filter(q => !q.correct);
  const q = miss[0];
  if(!q){ return go({name:"admin"}) }
  $app.innerHTML = `<div class="lesson">
    <div class="lbar"><button class="x" id="close" aria-label="Zpět">×</button><h2 style="font-size:18px">Klíč odpovědí · zbývá ${miss.length}</h2></div>
    <div class="qmeta"><span class="tag mono">${esc(q.code)}</span><span class="tag">${esc(AREAS[q.area]?.name||"")}</span>
      <a class="tag" href="${esc(q.source.url)}" target="_blank" rel="noopener">Otevřít okruh na eTesty</a></div>
    ${mediaHtml(q)}
    <h2 class="qtext">${esc(q.text)}</h2>
    <p class="small">Klepni na odpověď, kterou eTesty uvádí jako správnou.</p>
    <div class="answers">${q.answers.map(a => `<button class="ans" data-k="${a.key}"><span class="k">${a.key}</span>${ansHtml(a)}</button>`).join("")}</div>
    <button class="btn ghost" id="skip">Přeskočit na konec</button>
  </div>`;
  document.getElementById("close").onclick = () => go({name:"admin"});
  document.getElementById("skip").onclick = () => { OFFICIAL_BASE.push(OFFICIAL_BASE.splice(OFFICIAL_BASE.indexOf(q),1)[0]); keymode() };
  $app.querySelectorAll(".ans").forEach(b => b.onclick = () => { S.admin.key[q.code] = b.dataset.k; q.correct = b.dataset.k; save(); keymode() });
}

window.addEventListener("hashchange", () => { if(location.hash === "#admin") go({name:"admin"}) });
render();
</script>

</body>
</html>
