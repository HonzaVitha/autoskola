const SILENT = "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
let VOICE = null, speakId = 0;
const AUDIO = new Audio();
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^cs/i.test(v.lang));
  VOICE = vs.find(v => /anton|jakub|ond|petr|male|muž|tomas|tomáš|vlad/i.test(v.name)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// unlock audio on first tap (needed on iPhone so later playback is allowed)
document.addEventListener("click", function unlock(){ AUDIO.src = SILENT; AUDIO.play().catch(()=>{}); document.removeEventListener("click", unlock, true) }, true);
function setTalking(on){ document.querySelectorAll(".avatar").forEach(a => a.classList.toggle("talking", on)) }
AUDIO.onplay = () => { if(AUDIO.src !== SILENT) setTalking(true) };
AUDIO.onended = AUDIO.onpause = () => setTalking(false);
function hash(s){ let h = 5381; for(let i=0;i<s.length;i++) h = (h*33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36) }
async function elevenUrl(text){
  const t = S.tts, key = "https://tts.cache/" + t.voice + "/" + hash(text);
  let cache = null; try{ cache = await caches.open("tts-v1") }catch(e){}
  let res = cache && await cache.match(key);
  if(!res){
    const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(t.voice)}?output_format=mp3_44100_64`, {
      method:"POST", headers:{"xi-api-key":t.key, "Content-Type":"application/json", "Accept":"audio/mpeg"},
      body: JSON.stringify({text, model_id:"eleven_multilingual_v2", voice_settings:{stability:0.55, similarity_boost:0.75, style:0.1, speed:0.92}})
    });
    if(!r.ok) throw new Error("ElevenLabs " + r.status);
    res = r; if(cache){ try{ await cache.put(key, r.clone()) }catch(e){} }
  }
  return URL.createObjectURL(await res.blob());
}
async function speak(text){
  if(!S.voice || !text) return;
  stopVoice(); const id = ++speakId;
  if(S.tts && S.tts.key && S.tts.voice){
    try{
      const url = await elevenUrl(text);
      if(id !== speakId) return;
      AUDIO.src = url; await AUDIO.play(); S.ttsError = ""; return;
    }catch(e){ S.ttsError = String(e.message || e) }
  }
  if(!('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "cs-CZ"; if(VOICE) u.voice = VOICE; u.rate = 0.9;
    u.pitch = (VOICE && /anton|jakub|ond|petr|male|muž|tomas|tomáš|vlad/i.test(VOICE.name)) ? 1 : 0.8;
    u.onstart = () => setTalking(true); u.onend = u.onerror = () => setTalking(false);
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopVoice(){ speakId++; try{ speechSynthesis.cancel() }catch(e){} try{ AUDIO.pause() }catch(e){} setTalking(false) }

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PRAISE = ["Přesně tak.","Výborně.","Ano, správně.","Dobře.","Přesně."];
const CALM = ["Nevadí. Tohle si vysvětlíme.","V klidu. Podíváme se na to spolu.","To nic. Právě tady se učíš."];
const CHEERS = ["Každý den kousek. Žádný spěch.","Chyby jsou tady v pořádku. Přesně z nich se učíš.","Jdeme pomalu a s jistotou.","Tady nic nehrozí. Je to jen trénink."];
let lastPraise = -1;
function praise(code){
  const s = S.q[code];
  if(s && s.right >= 2 && Math.random() < .35) return "Tohle už znáš.";
  let i; do{ i = Math.floor(Math.random()*PRAISE.length) }while(i === lastPraise);
  lastPraise = i; return PRAISE[i];

function startLesson(title, list){
  if(!list.length) return;
  go({name:"lesson", title, queue:list.slice(), total:list.length, doneCount:0, right:0, xp0:S.xp, wrongInSession:{}});
}
function lesson(){
  const v = view, q = v.queue[0];
  if(!q){
    S.lessonsDone = (S.lessonsDone||0) + 1; if(v.title === "Opakování chyb") S.lastRedoAt = S.lessonsDone; save();
    return go({name:"done", title:v.title, total:v.total, right:v.right, xp:S.xp - v.xp0, hadWrong: Object.keys(v.wrongInSession).length});
  }
  const L = learning(q.code);
  v.cur = {code:q.code, hintLevel:0, t0:Date.now(), answered:false, choice:null};
  const pct = 100 * v.doneCount / (v.doneCount + v.queue.length);
  $app.innerHTML = `<div class="screen lesson-screen">
    <div class="lbar"><button class="x" id="close" aria-label="Ukončit lekci">×</button><div class="prog"><b style="width:${pct}%"></b></div>
      ${(L.hints||[]).length ? `<button class="hintbtn" id="hint">💡 Nápověda</button>` : ""}</div>
    <div class="qmeta">${v.wrongInSession[q.code] ? `<span class="tag warn">Ještě jednou</span>` : ""}<span class="tag">${esc(AREAS[q.area]?.name||"")}</span><span class="tag mono">${esc(q.code)}</span></div>
    ${mediaHtml(q)}
    <h2 class="qtext">${esc(q.text)}</h2>
    <div id="hintbox"></div>
    <div class="answers">${q.answers.map(a => `<button class="ans" data-k="${a.key}"><span class="k">${a.key}</span>${ansHtml(a)}</button>`).join("")}</div>
  </div>`;
  dock(`<button class="btn" id="check" disabled>Zkontrolovat</button>`);
  document.getElementById("close").onclick = () => go({name:"home"});
  const hb = document.getElementById("hint");
  if(hb) hb.onclick = () => {
    const hints = L.hints || [];
    if(v.cur.answered || v.cur.hintLevel >= hints.length) return;
    v.cur.hintLevel++;
    document.getElementById("hintbox").innerHTML = `<div class="hint">${hints.slice(0, v.cur.hintLevel).map(h=>`<p>💡 ${esc(h)}</p>`).join("")}</div>`;
    if(v.cur.hintLevel >= hints.length) hb.disabled = true;
  };
  $app.querySelectorAll(".ans").forEach(b => b.onclick = () => {
    if(v.cur.answered) return;
    v.cur.choice = b.dataset.k;
    $app.querySelectorAll(".ans").forEach(x => x.classList.toggle("sel", x === b));
    document.getElementById("check").disabled = false;
  });
  document.getElementById("check").onclick = () => { if(v.cur.choice) answer(q, v.cur.choice) };
}
function answer(q, key){
  const v = view; if(v.cur.answered) return;
  v.cur.answered = true;
  const correct = key === q.correct, used = v.cur.hintLevel > 0, ms = Date.now() - v.cur.t0;
  record(q.code, correct, used, ms, "learn");
  $app.querySelectorAll(".ans").forEach(b => {
    b.disabled = true; b.classList.remove("sel");
    if(b.dataset.k === q.correct) b.classList.add("right");
    else if(b.dataset.k === key) b.classList.add("wrong");
  });
  const hb = document.getElementById("hint"); if(hb) hb.hidden = true;
  v.queue.shift(); v.doneCount++;
  $app.querySelector(".prog b").style.width = (100 * v.doneCount / (v.doneCount + v.queue.length)) + "%";
  runRight = correct ? runRight + 1 : 0;
  if(correct){ if(!v.wrongInSession[q.code]) v.right++ }
  else if(!v.wrongInSession[q.code] || v.wrongInSession[q.code] < 2){
    // don't ask again immediately: put it back after ~3 other questions
    v.wrongInSession[q.code] = (v.wrongInSession[q.code]||0) + 1;
    v.queue.splice(Math.min(3, v.queue.length), 0, q);
  }
  feedback(q, correct);
}
function feedback(q, correct){
  const L = learning(q.code);
  const react = correct ? praise(q.code) : CALM[Math.floor(Math.random()*CALM.length)];
  const short = correct ? (L.short || "") : (L.wrong || L.short || "");
  const voiceText = correct ? (L.voiceRight || `${react} ${L.short||""}`) : (L.voiceWrong || `${react} ${L.wrong || L.short || ""}`);
  dock(`
    <div class="fb-head">${face(56)}<div class="react">${esc(react)}</div></div>
    ${correct && runRight >= 3 && runRight % 3 === 0 ? `<span class="cheer">${runRight}× správně za sebou. Jde ti to!</span>` : ""}
    ${!correct ? `<p class="mono" style="font-size:14px">Správně je ${esc(q.correct)}</p>` : ""}
    ${short ? `<p>${esc(short)}</p>` : (correct ? "" : "")}
    ${!correct && L.mnemonic ? `<div class="memo"><span class="label">Jak si to zapamatovat</span>${esc(L.mnemonic)}</div>` : ""}
    <div id="more"></div>
    <div class="fb-tools">
      ${L.why || L.rule ? `<button class="btn ghost small" id="why">${correct ? "Proč?" : "Ukaž mi proč"}</button>` : ""}
      ${L.scene ? `<button class="btn ghost small" id="show">Na křižovatce</button>` : ""}
      <span class="spacer"></span>
      <button class="iconbtn" id="rep" aria-label="Zopakovat vysvětlení">🔊</button>
      <button class="iconbtn" id="mute" aria-label="${S.voice ? "Vypnout hlas" : "Zapnout hlas"}">${S.voice?"🔇":"🔈"}</button>
    </div>
    <button class="btn ${correct?'ok':'warn'}" id="next">Pokračovat</button>`, "fb " + (correct ? "good" : "bad"));
  speak(voiceText);
  const why = document.getElementById("why");
  if(why) why.onclick = () => {
    document.getElementById("more").innerHTML = `<div class="detail">
      ${L.why ? `<div><h4>Proč</h4><p>${esc(L.why)}</p></div>` : ""}
      ${correct && L.mnemonic ? `<div><h4>Jak si to zapamatovat</h4><p>${esc(L.mnemonic)}</p></div>` : ""}
      ${L.pitfall ? `<div><h4>Pozor na</h4><p>${esc(L.pitfall)}</p></div>` : ""}
      ${L.rule ? `<div><h4>Pravidlo</h4><p>${esc(L.rule)}</p></div>` : ""}
      ${L.verified ? "" : `<p class="unver">Vysvětlení zatím neověřil instruktor.</p>`}
    </div>`;
    why.hidden = true;
    if(L.why) speak(L.why);
  };
  const show = document.getElementById("show");
  if(show) show.onclick = () => { const m = document.getElementById("more"); m.innerHTML = sceneHtml(L.scene); playScene(m.querySelector("svg"), L.scene); show.hidden = true };
  document.getElementById("rep").onclick = () => { const s = S.voice; S.voice = true; speak(voiceText); S.voice = s };
  const mute = document.getElementById("mute");
  mute.onclick = () => { S.voice = !S.voice; save(); if(!S.voice) stopVoice(); mute.textContent = S.voice?"🔇":"🔈" };
  document.getElementById("next").onclick = () => { stopVoice(); render(); window.scrollTo(0,0) };
}

/* ============ INTERSECTION SCENE (our own schematic, not an MD image) ============ */
// scene: {main:["S","N"]?, cars:[{id,from,to,me?,label?,kind?}], order:[ids], caption}
const ENTRY = {S:[165,300],N:[135,0],E:[300,135],W:[0,165]};
const STOP  = {S:[165,192],N:[135,108],E:[192,135],W:[108,165]};
const EXIT0 = {N:[165,108],S:[135,192],E:[192,165],W:[108,135]};
const EXIT  = {N:[165,-40],S:[135,340],E:[340,165],W:[-40,135]};
function carPath(c){
  const st = STOP[c.from], e0 = EXIT0[c.to], e1 = EXIT[c.to], en = ENTRY[c.from];
  const back = [st[0] + (en[0]-st[0])*0.38, st[1] + (en[1]-st[1])*0.38];
  const vertical = c.from === "S" || c.from === "N";
  const straight = (c.from==="S"&&c.to==="N")||(c.from==="N"&&c.to==="S")||(c.from==="E"&&c.to==="W")||(c.from==="W"&&c.to==="E");
  const ctrl = straight ? [(st[0]+e0[0])/2,(st[1]+e0[1])/2] : (vertical ? [st[0], e0[1]] : [e0[0], st[1]]);
  return `M${back} L${st} Q${ctrl} ${e0} L${e1}`;
}
function sceneHtml(sc){
  const main = sc.main || [];
  const road = `<rect x="110" y="0" width="80" height="300" fill="var(--asphalt)"/><rect x="0" y="110" width="300" height="80" fill="var(--asphalt)"/>`;
  const mainBand = main.length ? main.map(d => {
    const r = {N:"M150 0 V110",S:"M150 300 V190",E:"M300 150 H190",W:"M0 150 H110"}[d];
    return `<path d="${r}" stroke="var(--gold)" stroke-width="6" stroke-opacity=".55" fill="none"/>`}).join("") + `<path d="M${main.map(d=>({N:"150 110",S:"150 190",E:"190 150",W:"110 150"})[d]).join(" L")}" stroke="var(--gold)" stroke-width="6" stroke-opacity=".55" fill="none"/>` : "";
  const lanes = `<path d="M150 0 V108 M150 192 V300 M0 150 H108 M192 150 H300" stroke="var(--lane)" stroke-width="2" stroke-dasharray="10 9" fill="none"/>`;
  const cars = sc.cars.map((c,i) => `
    <path id="p-${c.id}" d="${carPath(c)}" fill="none" stroke="${c.me?'var(--sign)':'var(--muted)'}" stroke-width="2.5" stroke-dasharray="5 5" opacity=".9" marker-end="url(#arr)"/>
    <g id="car-${c.id}"><rect x="-11" y="-17" width="22" height="34" rx="6" fill="${c.me?'var(--sign)':(c.kind==='bike'?'var(--warn)':'var(--surface)')}" stroke="var(--ink)" stroke-width="2"/>
      <text y="5" text-anchor="middle" font-size="12" font-weight="900" font-family="var(--display)" fill="${c.me?'var(--sign-ink)':'var(--ink)'}">${esc(c.label || (c.me?"Ty":String.fromCharCode(65+i)))}</text></g>`).join("");
  return `<div class="scene"><svg viewBox="-10 -10 320 320" role="img" aria-label="Schéma křižovatky">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
    <rect x="-10" y="-10" width="320" height="320" fill="var(--bg)"/>${road}${mainBand}${lanes}${cars}</svg>
    <p class="cap">${esc(sc.caption || "")}</p><p class="cap">Naše zjednodušené schéma (není oficiální obrázek MD).</p>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ghost small" id="replay">Přehrát znovu</button></div></div>`;
}
function playScene(svg, sc){
  if(!svg) return;
  const order = sc.order || sc.cars.map(c=>c.id);
  const paths = {}, cars = {};
  sc.cars.forEach(c => { paths[c.id] = svg.querySelector("#p-"+c.id); cars[c.id] = svg.querySelector("#car-"+c.id) });
  const place = (id, t) => {
    const p = paths[id], L = p.getTotalLength(), a = p.getPointAtLength(t*L), b = p.getPointAtLength(Math.min(L, t*L+1));
    const ang = Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI + 90;
    cars[id].setAttribute("transform", `translate(${a.x} ${a.y}) rotate(${ang})`);
  };
  let raf;
  const run = () => {
    cancelAnimationFrame(raf);
    Object.keys(paths).forEach(id => place(id, 0));
    const dur = 1500, gap = 250, t0 = performance.now() + 400;
    const step = now => {
      order.forEach((id,i) => { const t = (now - t0 - i*(dur+gap)) / dur; place(id, Math.max(0, Math.min(.999, t))) });
      if(now - t0 < order.length*(dur+gap)) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  };
  run();
  const rb = svg.parentElement.querySelector("#replay"); if(rb) rb.onclick = run;
}

function finishExam(){
  clearInterval(timerId);
  const v = view; let pts = 0; const wrong = [];
  v.qs.forEach(q => {
    const a = v.answers[q.code], ok = a === q.correct;
    if(ok) pts += q.points; else wrong.push({q, a});
    record(q.code, ok, false, 0, "exam");
  });
  const max = v.qs.reduce((s,q)=>s+q.points,0);
  const need = Math.ceil(max * EXAM.passPts / EXAM.maxPts);
  S.exams = S.exams || [];
  const prev = S.exams.length ? S.exams[S.exams.length-1].pts : null;
  const res = {date:Date.now(), pts, max, need, prev, pass: pts >= need, mins: Math.round((Date.now()-v.t0)/60000)}; S.exams.push(res); S.xp += 20; bumpDay(20); save();
  go({name:"examResult", res, wrong});
}

function mistakes(){
  const st = topicStats();
  const answered = st.filter(x => x.pct !== null);
  const weak = answered.slice().sort((a,b)=>a.pct-b.pct)[0];
  const color = p => p === null ? "var(--line)" : p >= 85 ? "var(--ok)" : p >= 70 ? "var(--gold)" : "var(--warn)";
  const prob = official().filter(q => status(q.code) === "PROBLEMATICKÁ");
  const msg = weak ? (weak.pct >= 85 ? `Jde ti to dobře. Nejslabší je zatím ${weak.t.toLowerCase()}. Dáme si krátkou lekci?` : `Největší problém máš zatím s tématem ${weak.t.toLowerCase()}. Dáme si krátkou pětiminutovou lekci.`)
    : `Zatím nevím, co ti nejde. Udělej pár lekcí a tady uvidíš, na čem zapracovat.`;
  $app.innerHTML = `<div class="screen">
    ${statusBar()}
    <h1 style="font-size:26px">Moje chyby</h1>
    <div class="coach">${face(64)}<div class="bubble"><p style="font-weight:800">${esc(msg)}</p></div></div>

}

  document.getElementById("f").onchange = e => { v.filter = e.target.value; admin() };
  document.getElementById("s").onchange = e => { v.qtext = e.target.value; admin() };
  $app.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
    const box = b.closest(".adm-item"), code = box.dataset.c, o = {};
    box.querySelectorAll("[data-k]").forEach(el => {
      const k = el.dataset.k;
      if(k === "verified") o.verified = el.checked;
      else if(k === "hints") o.hints = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(k === "topics") o.topics = el.value.split(",").map(s=>s.trim()).filter(Boolean);
      else o[k] = el.value.trim();
    });
    S.admin.learning[code] = o;
    if(box.querySelector("[data-off]").checked) S.admin.inactive[code] = true; else delete S.admin.inactive[code];
    save(); b.textContent = "Uloženo ✓"; box.classList.toggle("off", !!S.admin.inactive[code]);
  });
  document.getElementById("tts-save").onclick = async () => {
    S.tts = {key:document.getElementById("tts-key").value.trim(), voice:document.getElementById("tts-voice").value.trim()}; save();
    const m = document.getElementById("tts-msg"); m.textContent = "Zkouším…"; S.voice = true;
    await speak(`Ahoj ${VOC}. Tohle je můj hlas. Jdeme na to.`);
    m.textContent = S.ttsError ? "Nefunguje: " + S.ttsError + " (hraje hlas telefonu)" : (S.tts.key ? "Hlas ElevenLabs funguje." : "Uloženo, bez klíče hraje hlas telefonu.");
  };
  const km = document.getElementById("keymode"); if(km) km.onclick = () => go({name:"keymode"});
  const io = document.getElementById("io");
  document.getElementById("exp").onclick = async () => {
    io.hidden = false; io.value = JSON.stringify(S.admin, null, 1); io.select();
    try{ await navigator.clipboard.writeText(io.value) }catch(e){}
  };
  document.getElementById("imp").onclick = () => {
    if(io.hidden){ io.hidden = false; io.value = ""; io.placeholder = "Vlož JSON a klepni znovu na Importovat"; return }
    try{ const d = JSON.parse(io.value); S.admin = {learning:d.learning||{}, inactive:d.inactive||{}, key:d.key||{}}; OFFICIAL_BASE.forEach(q => { if(S.admin.key[q.code]) q.correct = S.admin.key[q.code] }); save(); admin() }catch(e){ io.value = "Tohle není platný JSON export. Zkopíruj celý text exportu." }
  };
}

function keymode(){
  const miss = OFFICIAL_BASE.filter(q => !q.correct);
  const q = miss[0];
  if(!q){ return go({name:"admin"}) }
  $app.innerHTML = `<div class="screen">
    <div class="lbar"><button class="x" id="close" aria-label="Zpět">×</button><h2 style="font-size:18px">Klíč odpovědí · zbývá ${miss.length}</h2></div>
    <div class="qmeta"><span class="tag mono">${esc(q.code)}</span><span class="tag">${esc(AREAS[q.area]?.name||"")}</span>
      <a class="tag" href="${esc(q.source.url)}" target="_blank" rel="noopener">Otevřít okruh na eTesty</a></div>
    ${mediaHtml(q)}
    <h2 class="qtext">${esc(q.text)}</h2>
    <p class="small">Klepni na odpověď, kterou eTesty uvádí jako správnou.</p>
    <div class="answers">${q.answers.map(a => `<button class="ans" data-k="${a.key}"><span class="k">${a.key}</span>${ansHtml(a)}</button>`).join("")}</div>
    <button class="btn ghost" id="skip">Přeskočit na konec</button>
  </div>`;
  document.getElementById("close").onclick = () => go({name:"admin"});
  document.getElementById("skip").onclick = () => { OFFICIAL_BASE.push(OFFICIAL_BASE.splice(OFFICIAL_BASE.indexOf(q),1)[0]); keymode() };
  $app.querySelectorAll(".ans").forEach(b => b.onclick = () => { S.admin.key[q.code] = b.dataset.k; q.correct = b.dataset.k; save(); keymode() });
}

window.addEventListener("hashchange", () => { if(location.hash === "#admin") go({name:"admin"}) });
render();
</script>
